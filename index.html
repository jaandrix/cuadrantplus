}

function describirErrorSupabase(error) {
  if (!error) return 'Error desconocido';
  const partes = [error.message, error.details, error.hint, error.code]
    .filter(Boolean)
    .map(String);
  return partes.join(' · ');
}

async function crearWorker() {
  const nombre = document.getElementById('nt-nombre')?.value?.trim();
  const tipo = document.getElementById('nt-tipo')?.value || 'fijo';
  const grupo = document.getElementById('nt-grupo')?.value || 'manana';
  const costeHora = Math.max(0, parseFloat(document.getElementById('nt-coste')?.value) || 0);
  if (!nombre) { mostrarToast('Nombre requerido', true); return; }
  if (!state.centroId) { mostrarToast('No hay un centro seleccionado', true); return; }
  if (!tieneRol('coordinador')) { mostrarToast('No tienes permiso para crear trabajadores', true); return; }

  const turnoBase = grupo === 'manana' ? 'M' : grupo === 'tarde' ? 'T' : grupo === 'noche' ? 'N' : 'M';
  const payload = {
    centro_id: state.centroId,
    nombre,
    tipo,
    grupo,
    turno_base: turnoBase,
    turno_habitual: turnoBase,
    estado: tipo === 'sustituto' ? 'inactivo' : 'activo',
    coste_hora: costeHora
  };

  const { data, error } = await sb
    .from('trabajadores')
    .insert(payload)
    .select()
    .single();

  if (error || !data) {
    console.error('Error real de Supabase al crear trabajador:', error, payload);
    mostrarToast(`Error al crear: ${describirErrorSupabase(error)}`, true);
    return;
  }

  state.trabajadores.push(data);
  cerrarModal(); renderPersonal();
  mostrarToast(`${nombre.split(' ')[0]} añadido`);
}

async function iniciarBajaWorker(id) {
  const t = state.trabajadores.find(w => w.id === id);
  if (!t) return;
  const diaInicio = prompt(`Día de inicio de la baja (1-${diasEnMes(state.mesActual, state.anio)}):`);
  if (!diaInicio) return;
  const dia = parseInt(diaInicio) - 1;
  if (isNaN(dia) || dia < 0) { mostrarToast('Día inválido', true); return; }
  
  const fechaInicioBaja = `${state.anio}-${String(state.mesActual+1).padStart(2,'0')}-${String(dia+1).padStart(2,'0')}`;
  await sb.from('trabajadores').update({ estado: 'baja', fecha_baja: fechaInicioBaja }).eq('id', id);
  const { error: bajaError } = await sb.from('periodos_baja').insert({
    trabajador_id: id,
    centro_id: state.centroId,
    fecha_inicio: fechaInicioBaja
  });
  if (bajaError) console.warn('No se pudo guardar el periodo histórico de baja:', bajaError);
  t.estado = 'baja';
  const dias = diasEnMes(state.mesActual, state.anio);
  for (let d = dia; d < dias; d++) {
    await setCelda(id, d, 'IT', state.mesActual, state.anio);
  }
  cerrarModal(); renderPersonal();
  if (currentView === 'cuadrante') renderCuadrante();
  mostrarToast('Baja registrada');
}

function renderTareas() {
  const content = document.getElementById('content');
  if (!content) return;
  let html = `<div class="card"><div class="card-header">Tareas</div><div class="card-body">`;
  const pendientes = state.tareas.filter(t => !t.completada);
  if (!pendientes.length) html += `<div class="empty">Sin tareas pendientes</div>`;
  pendientes.forEach(t => {
    const badgeClass = t.prioridad === 'rojo' ? 'badge-red' : t.prioridad === 'amber' ? 'badge-amber' : 'badge-green';
    const fecha = new Date(t.fecha);
    const nombresAsignados = (t.asignados || [])
      .map(id => state.trabajadores.find(w => w.id === id)?.nombre)
      .filter(Boolean)
      .join(', ');
    html += `<div class="tarea-item">
      <div class="tarea-info">
        <div class="tarea-nombre">${t.nombre}</div>
        <div class="tarea-meta">${fecha.getDate()}/${fecha.getMonth()+1} · <span class="badge ${badgeClass}">${t.prioridad}</span>${nombresAsignados ? ' · Asignada a: ' + nombresAsignados : ''}</div>
      </div>
      <div><button class="btn btn-success btn-sm" onclick="completarTarea('${t.id}')">✓</button><button class="btn btn-danger btn-sm" onclick="eliminarTarea('${t.id}')">🗑</button></div>
    </div>`;
  });
  html += `<button class="btn btn-primary" style="margin-top:10px" onclick="modalNuevaTarea()">+ Nueva tarea</button></div></div>`;
  content.innerHTML = html;
}

    `<label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;">
      <input type="checkbox" value="${t.id}" ${tareaAsignadosSeleccionados.has(t.id) ? 'checked' : ''} onchange="toggleAsignado('${t.id}', this.checked)">
      ${t.nombre}
    </label>`
  ).join('') || '<div style="padding:10px;color:var(--text-muted);font-size:12px;">No hay trabajadores activos</div>';
}

function toggleAsignado(id, checked) {
  if (checked) tareaAsignadosSeleccionados.add(id);
  else tareaAsignadosSeleccionados.delete(id);
}

async function crearTarea() {
  if (!tieneRol('coordinador')) { mostrarToast('Solo el Encargado o el Gestor pueden crear tareas', true); return; }
  const nombre = document.getElementById('nt-nombre')?.value?.trim();
  const fecha = document.getElementById('nt-fecha')?.value;
  const prioridad = document.getElementById('nt-prio')?.value || 'amber';
  if (!nombre || !fecha) { mostrarToast('Nombre y fecha requeridos', true); return; }
  
  const { data, error } = await sb
    .from('tareas')
    .insert({ centro_id: state.centroId, nombre, fecha, prioridad, completada: false, creado_por: currentUserAuth?.id })
    .select()
    .single();
  if (error) { mostrarToast('Error al crear la tarea', true); return; }
  
  if (tareaAsignadosSeleccionados.size > 0) {
    const filas = [...tareaAsignadosSeleccionados].map(trabajador_id => ({ tarea_id: data.id, trabajador_id }));
    await sb.from('tarea_asignados').insert(filas);
    data.asignados = filas.map(f => f.trabajador_id);
  }
  state.tareas.push(data);
  cerrarModal(); renderTareas();
  mostrarToast('Tarea añadida');
}

async function completarTarea(id) {
  if (!tieneRol('coordinador')) { mostrarToast('No tienes permiso para modificar tareas', true); return; }
  const t = state.tareas.find(t => t.id === id);
  if (!t) return;
  await sb.from('tareas').update({ completada: true }).eq('id', id);
  t.completada = true;
  renderTareas();
  mostrarToast('Tarea completada');
}

async function eliminarTarea(id) {
  if (!tieneRol('coordinador')) { mostrarToast('No tienes permiso para eliminar tareas', true); return; }
  if (!confirm('¿Eliminar tarea?')) return;
  await sb.from('tareas').delete().eq('id', id);
  state.tareas = state.tareas.filter(t => t.id !== id);
  renderTareas();
  mostrarToast('Tarea eliminada');
}

// Divide un array en trozos de tamaño n (para no mandar peticiones gigantes a Supabase).
function chunkArray(arr, n) {
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

async function procesarImportacionExcel() {
  if (!tieneRol('coordinador')) {
    mostrarToast('No tienes permiso para importar', true);
    return;
  }
  const mes = parseInt(document.getElementById('import-mes')?.value, 10);
  const anio = parseInt(document.getElementById('import-anio')?.value, 10);
  const file = document.getElementById('import-excel-file')?.files[0];
  if (isNaN(mes) || mes < 0 || mes > 11 || isNaN(anio) || anio < 2000 || anio > 2100) {
    mostrarToast('Mes o año inválido', true);
    return;
  }
  if (!file) {
    mostrarToast('Selecciona un archivo', true);
    return;
  }
  if (typeof XLSX === 'undefined') {
    mostrarToast('No se pudo cargar el lector de Excel', true);
    return;
  }

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    if (!wb.SheetNames.length) throw new Error('El libro no contiene hojas');
    const hoja = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(hoja, { header: 1, defval: '' });
    if (!filas.length) throw new Error('El Excel está vacío');

    const cabecera = filas[0] || [];
    // Guardamos la posición real de cada día. Esto evita desajustes si hay columnas vacías/no numéricas.
    const colDias = cabecera.map((c, indice) => ({
      dia: parseInt(String(c).trim(), 10),
      indice
    })).filter(x => !isNaN(x.dia));
    const diasMes = diasEnMes(mes, anio);
    const diasValidos = colDias.filter(x => x.dia >= 1 && x.dia <= diasMes);
    if (!diasValidos.length) {
      mostrarToast('No se encontraron columnas de días válidas (1, 2, 3...)', true);
      return;
    }

    cerrarModal();
    mostrarToast('Importando cuadrante…');

    // ------------------------------------------------------------
    // PASO 1: recorremos el Excel una vez para identificar, por nombre
    // normalizado, la última fila con datos de cada trabajador (si hay
    // filas duplicadas, gana la última, igual que en la versión anterior).
    // ------------------------------------------------------------
    const filasPorNombre = new Map(); // nombreNormalizado -> { nombreExcel, fila }
    const ordenNombres = [];
    for (let f = 1; f < filas.length; f++) {
      const fila = filas[f] || [];
      const nombreExcel = String(fila[0] ?? '').trim();
      if (!nombreExcel) continue;
      const nombreNormalizado = normalizarNombre(nombreExcel);
      if (!filasPorNombre.has(nombreNormalizado)) ordenNombres.push(nombreNormalizado);
      filasPorNombre.set(nombreNormalizado, { nombreExcel, fila });
    }

    // ------------------------------------------------------------
    // PASO 2: creamos en un único INSERT todos los trabajadores nuevos
    // (los que aparecen en el Excel pero no existen aún en el centro).
    // ------------------------------------------------------------
    const trabajadoresPorNombre = new Map(
      state.trabajadores.map(t => [normalizarNombre(t.nombre), t])
    );
    const nombresNuevos = ordenNombres.filter(n => !trabajadoresPorNombre.has(n));
    let creados = 0;
    let erroresCreacion = 0;
    const noEncontrados = [];

    if (nombresNuevos.length) {
      const payloadNuevos = nombresNuevos.map(n => ({
        centro_id: state.centroId,
        nombre: filasPorNombre.get(n).nombreExcel,
        tipo: 'fijo',
        grupo: 'manana',
        turno_base: 'M',
        turno_habitual: 'M',
        estado: 'activo'
      }));

      const { data: nuevosTrabajadores, error: errorCreacion } = await sb
        .from('trabajadores')
        .insert(payloadNuevos)
        .select();

      if (errorCreacion) {
        // Si el lote falla entero (p. ej. por RLS), probamos uno a uno para
        // poder señalar exactamente qué nombre falla y por qué, sin perder
        // los que sí se pueden crear.
        console.error('Error creando trabajadores en lote, reintentando uno a uno:', errorCreacion);
        for (const n of nombresNuevos) {
          const { data: nt, error: e } = await sb
            .from('trabajadores')
            .insert({
              centro_id: state.centroId,
              nombre: filasPorNombre.get(n).nombreExcel,
              tipo: 'fijo',
              grupo: 'manana',
              turno_base: 'M',
              turno_habitual: 'M',
              estado: 'activo'
            })
            .select()
            .single();
          if (e || !nt) {
            erroresCreacion++;
            noEncontrados.push(`${filasPorNombre.get(n).nombreExcel} [${describirErrorSupabase(e)}]`);
            continue;
          }
          trabajadoresPorNombre.set(n, nt);
          state.trabajadores.push(nt);
          creados++;
        }
      } else {
        for (const t of nuevosTrabajadores) {
          trabajadoresPorNombre.set(normalizarNombre(t.nombre), t);
          state.trabajadores.push(t);
        }
        creados = nuevosTrabajadores.length;
      }
    }

    // ------------------------------------------------------------
    // PASO 3: calculamos qué celdas cambian de verdad (comparando con lo
    // que ya hay en state.turnos) y las acumulamos para mandarlas en
    // lotes, en vez de una petición de red por celda.
    // ------------------------------------------------------------
    const codigosDesconocidos = new Set();
    const upserts = []; // filas para turnos.upsert
    const borradosPorTrabajador = new Map(); // trabajador_id -> [fechas]
    let coincidencias = 0;

    for (const nombreNorm of ordenNombres) {
      const trabajador = trabajadoresPorNombre.get(nombreNorm);
      if (!trabajador) continue; // no se pudo crear, ya está en noEncontrados
      const { fila } = filasPorNombre.get(nombreNorm);
      coincidencias++;

      for (const col of diasValidos) {
        const valor = String(fila[col.indice] ?? '').trim().toUpperCase().replace(/\s+/g, '');
        const actual = getTurno(trabajador.id, col.dia - 1, mes, anio);
        if (valor === actual) continue;

        const conocido = CODIGOS_TURNO.some(c => c.cod === valor)
          || /^[2-9]$/.test(valor)
          || /^F(?:[1-9]|[12]\d|3[01])$/.test(valor)
          || /^LD(?:25|26)?$/.test(valor);
        if (valor && !conocido) codigosDesconocidos.add(valor);

        const fecha = `${anio}-${String(mes + 1).padStart(2, '0')}-${String(col.dia).padStart(2, '0')}`;
        if (valor === '') {
          if (!borradosPorTrabajador.has(trabajador.id)) borradosPorTrabajador.set(trabajador.id, []);
          borradosPorTrabajador.get(trabajador.id).push(fecha);
        } else {
          upserts.push({
            centro_id: state.centroId,
            trabajador_id: trabajador.id,
            fecha,
            codigo: valor,
            editado_por: currentUserAuth?.id
          });
        }
      }
    }

    // ------------------------------------------------------------
    // PASO 4: mandamos los cambios en lotes (upsert masivo + borrados
    // agrupados por trabajador). Esto sustituye a los cientos/miles de
    // peticiones individuales que hacía la versión anterior.
    // ------------------------------------------------------------
    let actualizados = 0;
    let erroresGuardado = 0;
    const TAM_LOTE = 300;

    for (const lote of chunkArray(upserts, TAM_LOTE)) {
      const { error } = await sb
        .from('turnos')
        .upsert(lote, { onConflict: 'centro_id,trabajador_id,fecha' });
      if (error) {
        console.error('Error en upsert de turnos:', error);
        erroresGuardado += lote.length;
      } else {
        actualizados += lote.length;
      }
    }

    for (const [trabajadorId, fechas] of borradosPorTrabajador.entries()) {
      for (const loteFechas of chunkArray(fechas, TAM_LOTE)) {
        const { error } = await sb
          .from('turnos')
          .delete()
          .eq('centro_id', state.centroId)
          .eq('trabajador_id', trabajadorId)
          .in('fecha', loteFechas);
        if (error) {
          console.error('Error borrando turnos:', error);
          erroresGuardado += loteFechas.length;
        } else {
          actualizados += loteFechas.length;
        }
      }
    }

    // Historial de cambios: se registra en lote (una o pocas peticiones),
    // no bloquea el resultado de la importación si falla.
    const entradasHistorial = [
      ...upserts.map(u => ({
        centro_id: state.centroId,
        trabajador_id: u.trabajador_id,
        usuario_id: currentUserAuth?.id,
        usuario_nombre: state.userProfile?.nombre_completo || 'Usuario',
        fecha_turno: u.fecha,
        valor_anterior: null,
        valor_nuevo: u.codigo
      })),
      ...[...borradosPorTrabajador.entries()].flatMap(([trabajadorId, fechas]) =>
        fechas.map(fecha => ({
          centro_id: state.centroId,
          trabajador_id: trabajadorId,
          usuario_id: currentUserAuth?.id,
          usuario_nombre: state.userProfile?.nombre_completo || 'Usuario',
          fecha_turno: fecha,
          valor_anterior: null,
          valor_nuevo: null
        }))
      )
    ];
    if (entradasHistorial.length && currentUserAuth?.id && state.centroId) {
      for (const lote of chunkArray(entradasHistorial, TAM_LOTE)) {
        sb.from('historial_cambios').insert(lote).then(() => {}).catch(() => {});
      }
    }

    // Refrescamos desde Supabase para dejar sincronizados perfiles nuevos y turnos.
    await loadTrabajadores();
    await loadTurnos(mes, anio);
    if (mes === state.mesActual && anio === state.anio && currentView === 'cuadrante') {
      renderCuadrante();
    }

    let mensaje = `Cuadrante actualizado: ${actualizados} celdas · ${coincidencias} trabajadores procesados`;
    if (creados) mensaje += ` · ${creados} trabajadores creados`;
    if (erroresCreacion) mensaje += ` · ${erroresCreacion} errores al crear trabajadores`;
    if (erroresGuardado) mensaje += ` · ${erroresGuardado} errores al guardar`;
    if (noEncontrados.length) mensaje += ` · sin procesar: ${[...new Set(noEncontrados)].join(', ')}`;
    if (codigosDesconocidos.size) mensaje += ` · códigos no catalogados: ${[...codigosDesconocidos].join(', ')}`;
    mostrarToast(mensaje, erroresCreacion > 0 || erroresGuardado > 0);
  } catch (err) {
    console.error('Error importando Excel:', err);
    mostrarToast('No se pudo leer el Excel. Comprueba que sea un archivo .xlsx/.xls válido.', true);
  }
}

    <div class="modal-btns">

      <button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button>
    </div>

function generarPDFPersonal(trabajadorId) {
  const t = state.trabajadores.find(w => w.id === trabajadorId);
  if (!t) return;
  if (!tieneRol('coordinador')) {
    if (normalizarNombre(t.nombre) !== normalizarNombre(state.userProfile?.nombre_completo)) {
      mostrarToast('Solo puedes exportar tu propio cuadrante', true);
      return;
    }
  }
  const mes = state.mesActual, anio = state.anio;
  const dias = diasEnMes(mes, anio);
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key]?.[trabajadorId] || {};
  const total = getTotalHorasMes(trabajadorId, mes, anio);

  let filas = '';
  for (let d = 0; d < dias; d++) {
    const val = turnos[d] || '';
    const dow = ['D','L','M','X','J','V','S'][new Date(anio, mes, d + 1).getDay()];
    const fest = esFestivo(anio, mes, d + 1);
    const label = CODIGOS_TURNO.find(c => c.cod === val)?.label || (val || 'Sin asignar');
    filas += `<tr class="${fest ? 'festivo' : ''}">
      <td>${d + 1}</td><td>${dow}</td><td class="cod ${val}">${val || '—'}</td><td>${label}</td>
    </tr>`;
  }

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Cuadrante ${t.nombre}</title>
  <style>
    @page { size: A4 portrait; margin: 16mm; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; color: #16181d; }
    h1 { font-size: 20px; margin-bottom: 2px; }
    .sub { color: #6b7280; font-size: 12px; margin-bottom: 18px; }
    .resumen { display: flex; gap: 14px; margin-bottom: 18px; }
    .resumen div { flex: 1; background: #f1f3f6; border-radius: 8px; padding: 10px; text-align: center; }
    .resumen .num { font-size: 20px; font-weight: 800; }
    .resumen .lbl { font-size: 10px; color: #6b7280; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { border: 1px solid #e2e5ea; padding: 5px 8px; text-align: left; }
    th { background: #f1f3f6; }
    tr.festivo { background: #fdf3e2; }
    .M,.T { font-weight: 600; } .N { color: #92400e; font-weight:700; }
    .L { color:#1d4ed8; font-weight:700; } .D { color:#15803d; font-weight:700; }
    .V,.VAC,.VA { color:#065f46; font-weight:700; background:#d1fae5; }
    .IT { color:#991b1b; font-weight:700; background:#fee2e2; }
    footer { margin-top: 22px; font-size: 9px; color: #9aa0aa; text-align: center; }
  </style></head><body>
    <h1>Cuadrante personal</h1>
    <div class="sub">${t.nombre} · ${MESES_NOMBRES[mes]} ${anio} · Generado el ${new Date().toLocaleString('es-ES')}</div>
    <div class="resumen">
      <div><div class="num">${total}</div><div class="lbl">Horas del mes</div></div>
      <div><div class="num">${Object.values(turnos).filter(v => v === 'V' || v === 'VAC' || v === 'VA').length}</div><div class="lbl">Días de vacaciones</div></div>
      <div><div class="num">${Object.values(turnos).filter(v => v === 'D' || v === 'L').length}</div><div class="lbl">Descansos/Libres</div></div>
    </div>
    <table><thead><tr><th>Día</th><th>Semana</th><th>Turno</th><th>Descripción</th></tr></thead>
    <tbody>${filas}</tbody></table>
    <footer>Documento generado automáticamente por Gestión Cuadrantes</footer>
  </body></html>`;

  const ventana = window.open();
  if (!ventana) { mostrarToast('El navegador bloqueó la ventana del PDF', true); return; }
  ventana.document.write(html);
  ventana.document.close();
  ventana.focus();
  cerrarModal();
  setTimeout(() => ventana.print(), 400);
}

async function mostrarResumenTrabajador(trabajadorId) {
  if (!tieneRol('coordinador')) {
    mostrarToast('Solo el Encargado o el Gestor pueden consultar este resumen', true);
    return;
  }
  const t = state.trabajadores.find(w => w.id === trabajadorId);
  if (!t) return;

  const horasMes = getTotalHorasMes(trabajadorId, state.mesActual, state.anio);

  const hoy = new Date();
  const inicioSemana = new Date(hoy);
  const diaSemana = inicioSemana.getDay() || 7;
  inicioSemana.setDate(inicioSemana.getDate() - diaSemana + 1);
  inicioSemana.setHours(0, 0, 0, 0);

  let horasSemana = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(inicioSemana);
    d.setDate(inicioSemana.getDate() + i);
    const key = clavesMes(d.getMonth(), d.getFullYear());
    if (!state.turnos[key]) {
      const fechaInicio = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
      const fechaFin = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(diasEnMes(d.getMonth(), d.getFullYear())).padStart(2,'0')}`;
      const { data } = await sb.from('turnos').select('fecha, codigo')
        .eq('centro_id', state.centroId).eq('trabajador_id', trabajadorId)
        .gte('fecha', fechaInicio).lte('fecha', fechaFin);
      state.turnos[key] = { [trabajadorId]: {} };
      (data || []).forEach(r => {
        state.turnos[key][trabajadorId][parseInt(r.fecha.split('-')[2], 10) - 1] = r.codigo;
      });
    }
    horasSemana += horasCodigo(state.turnos[key]?.[trabajadorId]?.[d.getDate()-1] || '');
  }

  let horasAnio = 0;
  const conteoTurnos = {};
  for (let m = 0; m < 12; m++) {
    const keyM = clavesMes(m, state.anio);
    if (!state.turnos[keyM]) {
      const fechaInicio = `${state.anio}-${String(m+1).padStart(2,'0')}-01`;
      const fechaFin = `${state.anio}-${String(m+1).padStart(2,'0')}-${String(diasEnMes(m, state.anio)).padStart(2,'0')}`;
      const { data } = await sb.from('turnos').select('fecha, codigo')
        .eq('centro_id', state.centroId).eq('trabajador_id', trabajadorId)
        .gte('fecha', fechaInicio).lte('fecha', fechaFin);
      state.turnos[keyM] = { [trabajadorId]: {} };
      (data || []).forEach(r => {
        state.turnos[keyM][trabajadorId][parseInt(r.fecha.split('-')[2], 10) - 1] = r.codigo;
      });
    }
    for (let d = 0; d < diasEnMes(m, state.anio); d++) {
      const val = state.turnos[keyM]?.[trabajadorId]?.[d] || '';
      if (val) {
        horasAnio += horasCodigo(val);
        conteoTurnos[val] = (conteoTurnos[val] || 0) + 1;
      }
    }
  }

  const { data: bajas, error: bajasError } = await sb.from('periodos_baja').select('*')
    .eq('centro_id', state.centroId)
    .eq('trabajador_id', trabajadorId)
    .order('fecha_inicio', { ascending: false });
  const bajasMostrar = bajasError ? [] : (bajas || []);

  const zona = state.zonas.find(z => z.id === t.zona_principal_id);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box centered">
    <div class="modal-title">Resumen — ${t.nombre}</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div style="flex:1;background:var(--surface-alt);border-radius:8px;padding:8px;text-align:center">
        <div style="font-size:18px;font-weight:800">${horasSemana}</div><div style="font-size:10px;color:var(--text-muted)">Horas esta semana</div></div>
      <div style="flex:1;background:var(--surface-alt);border-radius:8px;padding:8px;text-align:center">
        <div style="font-size:18px;font-weight:800">${horasMes}</div><div style="font-size:10px;color:var(--text-muted)">Horas este mes</div></div>
      <div style="flex:1;background:var(--surface-alt);border-radius:8px;padding:8px;text-align:center">
        <div style="font-size:18px;font-weight:800">${horasAnio}</div><div style="font-size:10px;color:var(--text-muted)">Horas este año</div></div>
    </div>
    <div style="font-size:12px;font-weight:700;margin-bottom:4px">Turnos realizados en el año</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
      ${Object.entries(conteoTurnos).map(([cod,n]) => `<span class="badge badge-blue">${cod}: ${n}</span>`).join('') || '<span class="empty">Sin datos</span>'}
    </div>
    <div style="font-size:12px;font-weight:700;margin-bottom:4px">Periodos de baja</div>
    <div>${bajasMostrar.length ? bajasMostrar.map(b => `<div class="hist-item">${b.fecha_inicio} → ${b.fecha_fin || 'actualidad'} ${b.motivo ? '· ' + b.motivo : ''}</div>`).join('') : '<div class="empty">Sin bajas registradas</div>'}</div>
    <div style="font-size:12px;font-weight:700;margin:10px 0 4px">Zona principal</div>
    <div>${zona?.nombre || 'Sin asignar'}</div>
    <div class="modal-btns"><button class="btn-modal-ok" onclick="cerrarModal()">Cerrar</button></div>
  </div>`;
  document.body.appendChild(overlay);
}

function tieneRol(rolMinimo) {
  const orden = { lector: 0, coordinador: 1, administrador: 2 };
  const rolActual = state.userProfile?.rol || 'lector';
  return orden[rolActual] >= orden[rolMinimo];
}

function actualizarNombreHeader() {
  const el = document.getElementById('header-user');
  if (el) {
    const nombre = state.userProfile?.nombre_completo || 'Usuario';
    const rol = state.userProfile?.rol || '';
    el.textContent = `(${nombre} · ${rol})`;
  }
}

async function guardarParametros() {
  const leer = id => parseFloat(document.getElementById(id)?.value) || 0;
  const nuevos = {
    jornada_max_diaria: leer('param-jornadaMaxDiaria'),
    jornada_min_diaria: leer('param-jornadaMinDiaria'),
    jornada_max_semanal: leer('param-jornadaMaxSemanal'),
    max_dias_seguidos: leer('param-maxDiasSeguidos'),
    preaviso_dias: leer('param-preavisoDias'),
    jornada_anual_diurna: leer('param-jornadaAnualDiurna'),
    jornada_anual_nocturna: leer('param-jornadaAnualNocturna'),
    vacaciones_anuales: leer('param-vacacionesAnuales'),
    presupuesto_mensual: leer('param-presupuestoMensual'),
    convenio_texto: document.getElementById('param-convenioTexto')?.value || '',
    convenio_vencido: document.getElementById('param-convenioVencido')?.checked || false
  };
  
  const { error } = await sb
    .from('centros')
    .update(nuevos)
    .eq('id', state.centroId);
  if (error) { mostrarToast('Error al guardar parámetros', true); return; }
  await loadParametros();
  renderAjustes();
  mostrarToast('Parámetros actualizados');
}

async function cargarMiembros() {
  if (!tieneRol('administrador')) return;
  const { data, error } = await sb.from('miembros_centro')
    .select('id, user_id, rol, rol_solicitado')
    .eq('centro_id', state.centroId);
  if (error) { console.error('Error loading miembros:', error); return; }

  const cont = document.getElementById('miembros-lista');
  if (!cont) return;
  if (!data?.length) {
    cont.innerHTML = '<div class="empty">No hay miembros en este centro.</div>';
    return;
  }

  const ids = data.map(m => m.user_id);
  const { data: perfiles, error: perfilesError } = await sb
    .from('perfiles')
    .select('id, nombre_completo, trabajador_id')
    .in('id', ids);
  if (perfilesError) console.warn('No se pudieron cargar los nombres de los miembros:', perfilesError);
  const perfilPorId = Object.fromEntries((perfiles || []).map(p => [p.id, p]));
  const trabajadorOptions = state.trabajadores.map(t => `<option value="${t.id}">${t.nombre}</option>`).join('');

  cont.innerHTML = data.map(m => `
    <div style="padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span style="font-size:13px;">
          ${perfilPorId[m.user_id]?.nombre_completo || 'Usuario'}
          ${m.rol_solicitado === 'coordinador' && m.rol !== 'coordinador' ? ' <span class="badge badge-amber">Pide ser Encargado</span>' : ''}
        </span>
        <select class="modal-input" style="width:auto;padding:4px 8px" onchange="cambiarRolMiembro('${m.id}', this.value)">
          <option value="lector" ${m.rol === 'lector' ? 'selected' : ''}>Trabajador/a</option>
          <option value="coordinador" ${m.rol === 'coordinador' ? 'selected' : ''}>Encargado</option>
          <option value="administrador" ${m.rol === 'administrador' ? 'selected' : ''}>Gestor</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:7px"><span style="font-size:10px;color:var(--text-muted);min-width:72px">Vincular a:</span><select class="modal-input" style="flex:1;padding:5px 8px" onchange="vincularTrabajadorMiembro('${m.user_id}', this.value)"><option value="">Sin trabajador</option>${state.trabajadores.map(t => `<option value="${t.id}" ${perfilPorId[m.user_id]?.trabajador_id === t.id ? 'selected' : ''}>${t.nombre}</option>`).join('')}</select></div>
    </div>
  `).join('');
}

async function vincularTrabajadorMiembro(userId, trabajadorId) {
  if (!tieneRol('administrador')) { mostrarToast('Solo el Gestor puede vincular trabajadores', true); return; }
  const { error } = await sb.rpc('vincular_trabajador_usuario', { p_user_id: userId, p_trabajador_id: trabajadorId || null, p_centro_id: state.centroId });
  if (error) { mostrarToast('No se pudo vincular el trabajador', true); return; }
  mostrarToast(trabajadorId ? 'Trabajador vinculado' : 'Vinculación eliminada');
  if (userId === currentUserAuth?.id) { state.userProfile.trabajador_id = trabajadorId || null; await loadData(); }
  else cargarMiembros();
}

async function cambiarRolMiembro(membresiaId, nuevoRol) {
  if (!tieneRol('administrador')) {
    mostrarToast('Solo el Gestor puede cambiar roles', true);
    return;
  }
  if (!['lector','coordinador','administrador'].includes(nuevoRol)) return;
  const { error } = await sb.from('miembros_centro')
    .update({ rol: nuevoRol })
    .eq('id', membresiaId)
    .eq('centro_id', state.centroId);
  if (error) { mostrarToast('Error al cambiar rol', true); return; }
  mostrarToast('Rol actualizado');
  await cargarCentrosDisponibles();
  const membresia = state.centrosDisponibles.find(m => m.centros.id === state.centroId);
  if (membresia) {
    state.centroActual = membresia;
    state.userProfile.rol = membresia.rol;
  }
  cargarMiembros();
}

// ============================================================
// COMPARTIR / RECIBIR CUADRANTE
// ============================================================
function copiarCodigoCompartido() {
  const codigo = state.centroActual?.centros?.codigo_compartido;
  if (!codigo) { mostrarToast('No hay código disponible', true); return; }
  navigator.clipboard?.writeText(codigo).then(() => {
    mostrarToast('Código copiado');
  }).catch(() => {
    const input = document.createElement('input');
    input.value = codigo;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    mostrarToast('Código copiado');
  });
}

async function regenerarCodigo() {
  if (!confirm('¿Regenerar el código de compartición? Esto invalidará el código anterior.')) return;
  try {
    const { data, error } = await sb.rpc('generar_codigo_centro');
    if (error) throw error;
    await sb.from('centros').update({ codigo_compartido: data }).eq('id', state.centroId);
    await cargarCentrosDisponibles();
    renderAjustes();
    mostrarToast('Código regenerado');
  } catch (e) {
    mostrarToast('Error al regenerar código', true);
  }
}

async function recibirCuadrante() {
  const codigo = document.getElementById('codigo-recibir')?.value?.trim();
  const rolSolicitado = document.getElementById('rol-solicitado')?.value || 'lector';
  if (!codigo || codigo.length !== 8) { mostrarToast('Introduce un código de 8 dígitos', true); return; }

  const { data: resultado, error } = await sb.rpc('unirse_a_centro_por_codigo', {
    p_codigo: codigo,
    p_rol_solicitado: rolSolicitado
  });
  const centro = Array.isArray(resultado) ? resultado[0] : resultado;
  if (error || !centro) {
    mostrarToast(error?.message || 'No se pudo unir al centro', true);
    return;
  }

  await cargarCentrosDisponibles();
  actualizarSelectorCentro();
  renderAjustes();
  mostrarToast(rolSolicitado === 'coordinador'
    ? `Te has unido a "${centro.nombre}". Pendiente de que el Gestor te dé permiso de Encargado.`
    : `Te has unido a "${centro.nombre}" como Trabajador/a`);
}

function exportarBackup() {
  const data = {
    version: APP_VERSION,
    anio: state.anio,
    trabajadores: state.trabajadores,
    zonas: state.zonas,
    tareas: state.tareas.map(t => ({ ...t, asignados: undefined })),
    parametros: state.parametros,
    turnos: state.turnos
  };
  const a = document.createElement('a');
  a.download = `cuadrante_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.click();
  URL.revokeObjectURL(a.href);
  mostrarToast('Backup exportado');
}

// ============================================================
// EXPORTAR CUADRANTE A EXCEL
// ============================================================
function exportarCuadranteExcel() {
  if (!tieneRol('coordinador')) { mostrarToast('Solo el Encargado o el Gestor pueden exportar el cuadrante completo', true); return; }
  if (typeof XLSX === 'undefined') {
    mostrarToast('No se pudo cargar el generador de Excel', true);
    return;
  }
  const mes = state.mesActual;
  const anio = state.anio;
  const dias = diasEnMes(mes, anio);
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key] || {};

  const cabecera = ['Trabajador'];
  for (let d = 1; d <= dias; d++) cabecera.push(d);
  cabecera.push('H');

  const filas = [cabecera];
  state.trabajadores.forEach(t => {
    const fila = [t.nombre];
    for (let d = 0; d < dias; d++) fila.push(turnos[t.id]?.[d] || '');
    fila.push(getTotalHorasMes(t.id, mes, anio));
    filas.push(fila);
  });

  const ws = XLSX.utils.aoa_to_sheet(filas);
  ws['!cols'] = [{ wch: 34 }, ...Array(dias).fill({ wch: 5 }), { wch: 8 }];
  ws['!freeze'] = { xSplit: 1, ySplit: 1 };
  ws['!autofilter'] = { ref: `A1:${XLSX.utils.encode_col(dias + 1)}${filas.length}` };

  // Hoja de referencia para que el archivo exportado sea útil también fuera de la aplicación.
  const leyenda = [
    ['Código', 'Descripción', 'Horas'],
    ...CODIGOS_TURNO.map(c => [c.cod, c.label, c.horas]),
    ['2-9', 'Código numérico de horas', 'Según código'],
    ['F2-F31', 'Código F personalizado', 0],
    ['LD25 / LD26', 'Código de libre disposición personalizado', 0]
  ];
  const wsLeyenda = XLSX.utils.aoa_to_sheet(leyenda);
  wsLeyenda['!cols'] = [{ wch: 16 }, { wch: 38 }, { wch: 14 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Cuadrante');
  XLSX.utils.book_append_sheet(wb, wsLeyenda, 'Leyenda');
  const nombreArchivo = `cuadrante_${MESES_NOMBRES[mes].toLowerCase()}_${anio}.xlsx`;
  XLSX.writeFile(wb, nombreArchivo);
  mostrarToast('Cuadrante Excel descargado');
}

// ============================================================
// GENERAR PDF (mejorado)
// ============================================================
function generarPDF() {
  const mes = state.mesActual;
  const anio = state.anio;
  const nombreMes = MESES_NOMBRES[mes];
  const dias = diasEnMes(mes, anio);
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key] || {};
  const activos = state.trabajadores.filter(t => t.estado !== 'baja');
  const BLOQUE = 18;
  const bloques = [];
  for (let i = 0; i < activos.length; i += BLOQUE) {
    bloques.push(activos.slice(i, i + BLOQUE));
  }
  
  function tablaBloque(lista) {
    let filas = '';
    for (const t of lista) {
      const total = getTotalHorasMes(t.id, mes, anio);
      let celdas = '';
      for (let d = 0; d < dias; d++) {
        const val = turnos[t.id]?.[d] || '';
        celdas += `<td class="celda ${val}">${val}</td>`;
      }
      filas += `<tr><td class="col-nombre">${t.nombre}</td>${celdas}<td class="col-total">${total}</td></tr>`;
    }
    return filas;
  }
  
  let cabecera = '';
  for (let d = 1; d <= dias; d++) {
    const dow = new Date(anio, mes, d).getDay();
    const dowName = ['D','L','M','X','J','V','S'][dow];
    cabecera += `<th>${d}<br><span class="dow">${dowName}</span></th>`;
  }
  
  const paginas = bloques.map((b, i) => `
    <div class="pagina">
      ${i === 0 ? `<h2>Cuadrante de trabajo</h2><p class="info">${nombreMes} ${anio} · Generado: ${new Date().toLocaleString('es-ES')}</p>` : ''}
      <table>
        <thead><tr><th class="col-nombre">Trabajador</th>${cabecera}<th>H</th></tr></thead>
        <tbody>${tablaBloque(b)}</tbody>
      </table>
    </div>
  `).join('');
  
  const contenidoHtml = `<!DOCTYPE html>
  <html><head><meta charset="UTF-8"><title>Cuadrante ${nombreMes} ${anio}</title>
  <style>
    @page { size: A4 landscape; margin: 8mm; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; font-size: 9px; }
    .pagina { page-break-after: always; }
    h2 { color: #0f172a; font-size: 14px; margin: 0 0 4px 0; }
    .info { color: #64748b; font-size: 8px; margin: 0 0 8px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 8px; table-layout: fixed; }
    th, td { border: 0.5px solid #999; padding: 3px 4px; text-align: center; }
    th { background: #f1f5f9; font-weight: 700; }
    .col-nombre { text-align: left; width: 15%; font-weight: 600; }
    .col-total { font-weight: 700; background: #e8f4fd; width: 5%; }
    .dow { font-weight: 400; font-size: 6px; color: #94a3b8; }
    thead { display: table-header-group; }
    tr { page-break-inside: avoid; }
    .L { color: #1d4ed8; font-weight: 700; }
    .D { color: #15803d; font-weight: 700; }
    .M, .T { color: #374151; font-weight: 600; }
    .N { color: #92400e; font-weight: 700; }
    .V, .VAC, .VA { color: #065f46; font-weight: 700; background: #d1fae5; }
    .IT { color: #991b1b; font-weight: 700; background: #fee2e2; }
    .F1 { color: #ea580c; font-weight: 700; }
    .PR { color: #7c3aed; font-weight: 700; background: #ede9fe; }
    .CF { color: #0891b2; font-weight: 700; background: #cffafe; }
    .LD, .LDA { color: #b45309; font-weight: 700; background: #fffbeb; }
    .LIB { color: #0e7490; font-weight: 700; }
    .HE { color: #6d28d9; font-weight: 700; }
  </style>
  </head><body>${paginas}</body></html>`;
  
  const ventana = window.open();
  ventana.document.write(contenidoHtml);
  ventana.document.close();
  ventana.focus();
  setTimeout(() => ventana.print(), 500);
}

// ============================================================
// UTILIDADES
// ============================================================
function mostrarToast(msg, isError = false) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = isError ? 'error show' : 'show';
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2200);
}

function cerrarModal() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
}

function toggleUserMenu() {
  if (confirm('¿Cerrar sesión?')) signOut();
}

function showView(view) {
  if (!state.userProfile) return;
  if (!tieneRol('coordinador') && ['personal','tareas','analitica'].includes(view)) view = 'cuadrante';
  currentView = view;
  document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(`nav-${view}`)?.classList.add('active');
  if (view === 'home') renderHome();
  else if (view === 'cuadrante') renderCuadrante();
  else if (view === 'personal') renderPersonal();
  else if (view === 'tareas') renderTareas();
  else if (view === 'ajustes') renderAjustes();
  else if (view === 'analitica') renderAnalitica();
}

function render() {
  if (state.userProfile && state.centroId) {
    document.getElementById('nav').style.display = '';
    document.getElementById('nav-personal')?.classList.toggle('hidden', !tieneRol('coordinador'));
    document.getElementById('nav-tareas')?.classList.toggle('hidden', !tieneRol('coordinador'));
    document.getElementById('nav-analitica')?.classList.toggle('hidden', !tieneRol('coordinador'));
    showView(currentView);
  } else {
    renderLogin();
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  cargarTemaGuardado();

// Importar backup completo
document.getElementById('file-import')?.addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!tieneRol('coordinador')) throw new Error('No tienes permisos para importar un backup');
      const mapaIds = new Map();
      for (const t of data.trabajadores || []) {
        if (!t?.nombre) continue;
        const payload = {
          ...(t.id ? { id: t.id } : {}),
          centro_id: state.centroId,
          nombre: t.nombre,
          tipo: t.tipo || 'fijo',
          grupo: t.grupo || 'manana',
          turno_base: t.turno_base || 'M',
          turno_habitual: t.turno_habitual || t.turno_base || 'M',
          estado: t.estado || 'activo'
        };
        const { data: trabajador, error: trabajadorError } = await sb.from('trabajadores').upsert(payload).select().single();
        if (trabajadorError || !trabajador) throw trabajadorError || new Error(`No se pudo importar ${t.nombre}`);
        if (t.id) mapaIds.set(t.id, trabajador.id);
      }
      for (const key in data.turnos || {}) {
        const [anio, mes] = key.split('-').map(Number);
        for (const trabajadorIdOriginal in data.turnos[key]) {
          const trabajadorId = mapaIds.get(trabajadorIdOriginal) || trabajadorIdOriginal;
          for (const dia in data.turnos[key][trabajadorIdOriginal]) {
            const val = data.turnos[key][trabajadorIdOriginal][dia];
            const ok = await setCelda(trabajadorId, parseInt(dia, 10), val || '', mes, anio);
            if (!ok) throw new Error(`No se pudo guardar el turno de ${trabajadorId}`);
          }
        }
      }
      await loadData();
      render();
      mostrarToast('Backup importado');
    } catch (err) {
      mostrarToast('Archivo inválido', true);
    }
  };
  r.readAsText(file);
  event.target.value = '';
});

// Importar personal desde JSON
document.getElementById('file-import-personal')?.addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!tieneRol('coordinador')) throw new Error('No tienes permisos para importar personal');
      const lista = Array.isArray(data) ? data : (data.trabajadores || []);
      if (!Array.isArray(lista) || !lista.length) throw new Error('Formato inválido');
      let importados = 0;
      const existentes = new Set(state.trabajadores.map(t => normalizarNombre(t.nombre)));
      for (const t of lista) {
        if (!t?.nombre) continue;
        const nombreNormalizado = normalizarNombre(t.nombre);
        if (existentes.has(nombreNormalizado)) continue;
        const { error } = await sb.from('trabajadores').insert({
          centro_id: state.centroId,
          nombre: t.nombre,
          tipo: t.tipo || 'fijo',
          grupo: t.grupo || 'manana',
          turno_base: t.turno_base || 'M',
          turno_habitual: t.turno_habitual || t.turno_base || 'M',
          estado: t.estado || 'activo'
        });
        if (!error) { importados++; existentes.add(nombreNormalizado); }
      }
      await loadTrabajadores();
      renderPersonal();
      mostrarToast(`${importados} trabajador(es) importado(s)`);
    } catch (err) {
      mostrarToast('Archivo inválido', true);
    }
  };
  r.readAsText(file);
  event.target.value = '';
});
</script>
