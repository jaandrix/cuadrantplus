<!DOCTYPE html>
<html lang="es" data-theme="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestión Cuadrantes">
<meta name="theme-color" content="#F6F5FC">
<title>Gestión Cuadrantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ==================== VARIABLES CSS ==================== */
  :root {
    --bg: #F6F5FC;
    --surface: #FFFFFF;
    --surface-alt: #F0EEFA;
    --border: #E7E4F5;
    --text: #262340;
    --text-muted: #8B87A6;
    --text-soft: #B4B1C9;
    --accent: #6C63E0;
    --accent-hover: #5A51D6;
    --accent-soft: #EDEBFC;
    --accent-contrast: #FFFFFF;
    --danger: #C4453A;
    --danger-bg: #FBEAE8;
    --warning: #B8862E;
    --warning-bg: #FBF2E2;
    --success: #3E9163;
    --success-bg: #E9F5EE;
    --info: #4C6FD6;
    --info-bg: #ECF0FC;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --radius-pill: 999px;
    --shadow-sm: 0 1px 3px rgba(76, 68, 130, 0.06);
    --shadow-md: 0 8px 24px rgba(76, 68, 130, 0.10);
    --radius: var(--radius-md);
    --shadow: var(--shadow-sm);
    --font-base: 15px;
  }

  [data-theme="oscuro"] {
    --bg: #17151F;
    --surface: #1F1C2B;
    --surface-alt: #262336;
    --border: #322E45;
    --text: #ECEAF6;
    --text-muted: #9C98B8;
    --text-soft: #6C6886;
    --accent: #8A82F0;
    --accent-hover: #9B94F5;
    --accent-soft: #2A2542;
    --accent-contrast: #17151F;
    --danger: #E39089;
    --danger-bg: #3A2320;
    --warning: #E8C27E;
    --warning-bg: #3A2E17;
    --success: #8FD3AA;
    --success-bg: #1B3226;
    --info: #A9BBF2;
    --info-bg: #212C4D;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.25);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.35);
    --radius: var(--radius-md);
    --shadow: var(--shadow-sm);
  }

  /* ==================== ESTILOS GLOBALES ==================== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--text); overflow: hidden; height: 100dvh; font-size: var(--font-base); line-height: 1.5; }
  #app { display: flex; flex-direction: column; height: 100dvh; background: var(--bg); }

  /* ==================== HEADER ==================== */
  #header { background: var(--accent); color: var(--accent-contrast); padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 10px; }
  #header-left h1 { font-size: 18px; font-weight: 800; }
  #header-left h1 small { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-left: 8px; }
  #save-indicator { font-size: 11px; color: var(--success); opacity: 0; transition: opacity .4s; white-space: nowrap; }
  #save-indicator.show { opacity: 1; }

  .logout-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--accent-contrast); font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: var(--radius); cursor: pointer; opacity: 0.8; transition: opacity .2s; }
  .logout-btn:hover { opacity: 1; background: rgba(255,255,255,0.1); }

  /* ==================== BANNER ==================== */
  #banner-convenio { background: var(--danger); color: white; padding: 8px 14px; font-size: 12px; text-align: center; font-weight: 600; flex-shrink: 0; }

  /* ==================== CONTENT ==================== */
  #content { flex: 1; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; }
  
  /* ==================== NAV ==================== */
  #nav { display: flex; background: var(--surface); border-top: 1.5px solid var(--border); flex-shrink: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #nav button { flex: 1; background: none; border: none; padding: 10px 0 5px; cursor: pointer; color: var(--text-muted); border-top: 2.5px solid transparent; font-weight: 600; font-size: 11px; transition: color .2s; }
  #nav button.active { color: var(--text); border-top-color: var(--accent); }
  #nav button .ni { display: block; font-size: 0; line-height: 0; margin-bottom: 2px; }
  #nav button .ni svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #nav button .nl { font-size: 10px; margin-top: 2px; }

  /* ==================== CARDS ==================== */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .card-header { padding: 12px 16px; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--border); background: var(--surface-alt); display: flex; justify-content: space-between; align-items: center; }
  .card-body { padding: 14px 16px; }

  /* ==================== BOTONES ==================== */
  .btn { border: none; border-radius: var(--radius); padding: 11px 16px; font-weight: 600; cursor: pointer; font-size: 13px; transition: opacity .15s; width: 100%; margin-bottom: 8px; text-align: center; }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-secondary { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
  .btn-legal { background: var(--info-bg); color: var(--info); border: 1px solid var(--info); }
  .btn-success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
  .btn-sm { padding: 6px 12px; border-radius: 20px; font-size: 11px; margin-bottom: 0; width: auto; display: inline-block; }
  .btn-xs { padding: 4px 8px; border-radius: 8px; font-size: 10px; margin-bottom: 0; width: auto; display: inline-block; }
  .btn-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }
  .btn[disabled] { opacity: 0.6; cursor: not-allowed; }

  /* ==================== BADGES ==================== */
  .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; display: inline-block; }
  .badge-baja { background: var(--danger-bg); color: var(--danger); }
  .badge-sustituto { background: var(--danger-bg); color: var(--danger); }
  .badge-red { background: var(--danger-bg); color: var(--danger); }
  .badge-amber { background: var(--warning-bg); color: var(--warning); }
  .badge-green { background: var(--success-bg); color: var(--success); }
  .badge-blue { background: var(--info-bg); color: var(--info); }

  /* ==================== AVISOS ==================== */
  .aviso { padding: 10px 12px; border-radius: var(--radius); margin-bottom: 8px; font-size: 12px; border-left: 4px solid; }
  .aviso-rojo { background: var(--danger-bg); border-color: var(--danger); }
  .aviso-amber { background: var(--warning-bg); border-color: var(--warning); }
  .aviso-verde { background: var(--success-bg); border-color: var(--success); }
  .aviso-azul { background: var(--info-bg); border-color: var(--info); }
  .aviso-gris { background: var(--surface-alt); border-color: var(--text-muted); }

  /* ==================== CALENDARIO ==================== */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-wd { font-size: 10px; font-weight: 700; color: var(--text-muted); padding: 4px 0; }
  .cal-day { background: var(--surface-alt); border-radius: var(--radius); padding: 8px 2px; border: 1px solid var(--border); cursor: pointer; transition: background .2s; }
  .cal-day:hover { background: var(--border); }
  .cal-day.hoy { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .cal-day-num { font-size: 13px; font-weight: 600; }
  .cal-dot { width: 8px; height: 8px; border-radius: 50%; margin: 4px auto 0; }
  .cal-dot.rojo { background: var(--danger); }
  .cal-dot.amber { background: var(--warning); }
  .cal-dot.verde { background: var(--success); }
  .festivo-icon { font-size: 10px; margin-left: 2px; }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav-btn { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; color: var(--text); }

  /* ==================== SELECTOR DE MES ==================== */
  .mes-selector { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .mes-btn { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 20px; padding: 5px 11px; font-size: 11px; cursor: pointer; color: var(--text); transition: all .2s; }
  .mes-btn.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .mes-btn:hover { background: var(--border); }

  /* ==================== CUADRANTE ==================== */
  .cuad-toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .cuad-search { flex: 1; min-width: 140px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; background: var(--surface); color: var(--text); outline: none; }
  .cuad-search:focus { border-color: var(--accent); }

  .wrap { overflow-x: auto; padding-bottom: 4px; }
  table { border-collapse: collapse; font-size: 10px; min-width: 850px; width: 100%; }
  th, td { border: 0.5px solid var(--border); text-align: center; padding: 4px 3px; }
  th { background: var(--surface-alt); font-weight: 700; position: sticky; top: 0; z-index: 2; }
  td.nombre-col { text-align: left; background: var(--surface); position: sticky; left: 0; z-index: 1; font-weight: 600; }
  th.nombre-col, td.nombre-col { text-align: left; padding-left: 8px; min-width: 160px; }
  th.total-col, td.total-col { min-width: 38px; font-weight: 700; background: var(--info-bg); position: sticky; right: 0; }
  tr:nth-child(even) td { background: var(--bg); }
  .wkend { background: var(--surface-alt) !important; }
  .festivo-cell { background: var(--warning-bg) !important; }
  .editable-cell { cursor: pointer; transition: background .15s; }
  .editable-cell:active { background: var(--info-bg) !important; }
  .baja-row td { opacity: 0.55; background: var(--danger-bg) !important; }
  .sustituto-row td { color: var(--danger); font-weight: 500; }

  /* ==================== CÓDIGOS DE TURNO (colores) ==================== */
  .L { color: #1d4ed8; font-weight: 700; }
  .D { color: #15803d; font-weight: 700; }
  .E { color: #9333ea; font-weight: 700; background: #f3e8ff !important; }
  .F1, .F2, .F3, .F4, .F5, .F6, .F7, .F8, .F9, .F10, .F11, .F12, .F13, .F14, .F15, .F16, .F17, .F18, .F19, .F20, .F21, .F22, .F23, .F24, .F25, .F26, .F27, .F28, .F29, .F30, .F31 { color: #ea580c; font-weight: 700; }
  .N { color: #92400e; font-weight: 700; }
  .M, .T { color: #374151; font-weight: 600; }
  .HE { color: #6d28d9; font-weight: 700; }
  .LIB { color: #0e7490; font-weight: 700; }
  .VAC, .V { color: #065f46; font-weight: 700; background: #d1fae5 !important; }
  .VA { color: #065f46; font-weight: 700; background: #d1fae5 !important; }
  .PR { color: #7c3aed; font-weight: 700; background: #ede9fe !important; }
  .CF { color: #0891b2; font-weight: 700; background: #cffafe !important; }
  .IT { color: #991b1b; font-weight: 700; background: #fee2e2 !important; }
  .LD, .LDA, .LD25, .LD26 { color: #b45309; font-weight: 700; background: #fffbeb !important; }
  .cobertura-row td { background: var(--success-bg); font-weight: 700; color: var(--success); border-top: 2px solid var(--success); }

  /* ==================== PERSONAL ==================== */
  .worker-search { width: 100%; padding: 9px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; margin-bottom: 12px; outline: none; background: var(--surface); color: var(--text); }
  .worker-search:focus { border-color: var(--accent); }
  .worker-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; cursor: pointer; margin-bottom: 8px; transition: border-color .2s; }
  .worker-item:hover { border-color: var(--accent); }
  .worker-name { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .worker-stats { font-size: 11px; color: var(--text-muted); margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; }
  .bolsa-pos { color: var(--success); font-weight: 700; }
  .bolsa-neg { color: var(--danger); font-weight: 700; }
  .vac-bar { height: 5px; background: var(--surface-alt); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .vac-bar-fill { height: 100%; background: var(--success); border-radius: 3px; }

  /* ==================== TAREAS ==================== */
  .tarea-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .tarea-info { flex: 1; }
  .tarea-nombre { font-weight: 600; font-size: 13px; }
  .tarea-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ==================== MODALES ==================== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 200; backdrop-filter: blur(2px); }
  .modal-box { background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; padding: 22px 20px; width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; }
  .modal-box.centered { border-radius: var(--radius); margin: 16px; max-height: 88vh; align-self: center; }
  .modal-title { font-size: 17px; font-weight: 800; margin-bottom: 16px; }
  .modal-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; margin-top: 12px; display: block; }
  .modal-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none; background: var(--surface); color: var(--text); }
  .modal-input:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
  .modal-btns button { flex: 1; padding: 12px; border-radius: var(--radius); border: none; font-weight: 700; cursor: pointer; }
  .btn-modal-ok { background: var(--accent); color: var(--accent-contrast); }
  .btn-modal-cancel { background: var(--surface-alt); color: var(--text); }

  /* ==================== SELECTOR DE TURNO ==================== */
  .turno-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .turno-btn { padding: 14px 4px; border-radius: var(--radius); border: 2px solid transparent; font-weight: 800; font-size: 16px; cursor: pointer; text-align: center; transition: all .15s; }
  .turno-btn:active { transform: scale(0.96); }
  .turno-btn.sel { border-color: var(--accent) !important; }
  .tb-L { background: #dbeafe; color: #1d4ed8; }
  .tb-D { background: #dcfce7; color: #15803d; }
  .tb-E { background: #f3e8ff; color: #9333ea; }
  .tb-F1 { background: #ffedd5; color: #ea580c; }
  .tb-N { background: #fef3c7; color: #92400e; }
  .tb-M, .tb-T { background: var(--surface-alt); color: var(--text); }
  .tb-HE { background: #ede9fe; color: #6d28d9; }
  .tb-LIB { background: #cffafe; color: #0e7490; }
  .tb-VAC, .tb-V, .tb-VA { background: #d1fae5; color: #065f46; }
  .tb-PR { background: #ede9fe; color: #7c3aed; }
  .tb-CF { background: #cffafe; color: #0891b2; }
  .tb-IT { background: #fee2e2; color: #991b1b; }
  .tb-LD, .tb-LDA { background: #fffbeb; color: #b45309; }
  .tb-clear { background: var(--surface-alt); color: var(--text-muted); }
  .turno-label { font-size: 9px; font-weight: 600; margin-top: 3px; opacity: 0.75; }

  /* ==================== HISTORIAL ==================== */
  .hist-item { font-size: 11px; padding: 8px 16px; border-bottom: 1px solid var(--border); color: var(--text-muted); }
  
  /* ==================== ZONAS (en modal) ==================== */
  .zona-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .zona-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .zona-nombre { font-weight: 800; font-size: 14px; }
  .zona-turnos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; margin-bottom: 12px; }
  .zona-turno-box { background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; text-align: center; }
  .zona-turno-label { font-size: 10px; color: var(--text-muted); font-weight: 600; }
  .zona-turno-num { font-size: 20px; font-weight: 800; color: var(--text); }
  .zona-workers { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }

  /* ==================== FILTROS ==================== */
  .filtro-tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
  .filtro-tab { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 11px; cursor: pointer; white-space: nowrap; font-weight: 600; flex-shrink: 0; color: var(--text); transition: all .2s; }
  .filtro-tab.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .filtro-tab:hover { background: var(--border); }

  /* ==================== EVENTOS ==================== */
  .eventos-list { max-height: 300px; overflow-y: auto; }
  .evento-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border); }
  .evento-emoji { font-size: 20px; min-width: 40px; text-align: center; }
  .evento-info { flex: 1; }
  .evento-titulo { font-weight: 700; font-size: 13px; }
  .evento-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .evento-badge { display: inline-block; padding: 2px 6px; border-radius: 12px; font-size: 9px; font-weight: 600; }

  /* ==================== LOGIN ==================== */
  .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; padding: 20px; }
  .login-box { background: var(--surface); border-radius: var(--radius); padding: 32px 24px; width: 100%; max-width: 400px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .login-box h2 { font-size: 22px; margin-bottom: 8px; }
  .login-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  .login-box input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; margin-bottom: 12px; outline: none; background: var(--surface); color: var(--text); }
  .login-box input:focus { border-color: var(--accent); }
  .login-box .btn { margin-bottom: 8px; }
  .login-box .switch { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 12px; }
  .login-box .switch a { color: var(--accent); font-weight: 700; cursor: pointer; }
  .login-error { display: none; background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; margin-bottom: 12px; }
  .login-error.show { display: block; }
  .login-field { position: relative; margin-bottom: 12px; }
  .login-field input { margin-bottom: 0; padding-right: 42px; }
  .login-field .toggle-pass { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 15px; color: var(--text-muted); padding: 4px; }

  /* ==================== TOAST ==================== */
  #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-contrast); padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 500; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--danger); }

  /* ==================== UTILIDADES ==================== */
  .empty { text-align: center; padding: 28px; color: var(--text-muted); font-size: 13px; }
  input[type=file] { display: none; }
  .hidden { display: none !important; }
  .mt-8 { margin-top: 8px; }
  .mb-8 { margin-bottom: 8px; }
  .gap-8 { gap: 8px; }
  .flex { display: flex; }
  .flex-wrap { flex-wrap: wrap; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }

  /* ==================== CÓDIGO COMPARTIDO ==================== */
  .codigo-compartido { font-size: 28px; font-weight: 800; letter-spacing: 4px; text-align: center; padding: 16px; background: var(--surface-alt); border-radius: var(--radius); font-family: monospace; margin: 8px 0; }
  
  /* ==================== SELECCIÓN DE CENTRO ==================== */
  .centro-selector { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: var(--surface-alt); border-radius: var(--radius); font-size: 12px; }
  .centro-selector select { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 8px; font-size: 12px; color: var(--text); outline: none; }

  /* ==================== TOGGLE TEMA ==================== */
  .theme-toggle { background: none; border: none; cursor: pointer; font-size: 18px; padding: 4px; border-radius: var(--radius); color: var(--text); transition: background .2s; }
  .theme-toggle:hover { background: var(--surface-alt); }


  .metric-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }

function getNombreFestivo(anio, mes, dia) {
  const f = `${anio}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
  return FESTIVOS_DETALLE[f] || { nombre: "Día festivo", color: "verde" };
}

function diasEnMes(mes, anio) { return new Date(anio, mes + 1, 0).getDate(); }
function esFinDeSemana(dia, mes, anio) { return new Date(anio, mes, dia).getDay() === 0 || new Date(anio, mes, dia).getDay() === 6; }
function clavesMes(mes, anio) { return `${anio}-${mes}`; }

function normalizarNombre(valor) {
  return String(valor || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/mª/gi, 'm')
    .replace(/[.,;:]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function horasCodigo(cod) {
  if (!cod) return 0;
  const valor = String(cod).trim().toUpperCase();
  const entry = CODIGOS_TURNO.find(c => c.cod === valor);
  if (entry) return entry.horas;
  // Los códigos numéricos 2-9 representan horas; códigos como F6 o LD25 NO.
  if (/^[2-9]$/.test(valor)) return parseInt(valor, 10);
  const extra = valor.match(/^HE(\d+(?:[.,]\d+)?)$/);
  if (extra) return parseFloat(extra[1].replace(',', '.'));
  return 0;
}

// ============================================================
// TEMA (Claro/Oscuro)
// ============================================================
function aplicarTema(modo) {
  if (!modo) modo = state.tema || "claro";
  document.documentElement.setAttribute('data-theme', modo);
  state.tema = modo;
  localStorage.setItem('theme', modo);
  // Actualizar botón
  const btn = document.querySelector('.theme-toggle');
  if (btn) btn.textContent = modo === 'claro' ? '🌙' : '☀️';
  // Guardar en Supabase si hay usuario
  if (currentUserAuth && state.centroId) {
    sb.from('perfiles').update({ tema: modo }).eq('id', currentUserAuth.id).then(() => {}).catch(() => {});
  }
}

function toggleTema() {
  const nuevo = state.tema === "claro" ? "oscuro" : "claro";
  aplicarTema(nuevo);
}

function cargarTemaGuardado() {
  const local = localStorage.getItem('theme');
  if (local) {
    aplicarTema(local);
    return;
  }
  // Intentar cargar desde Supabase si hay sesión
  if (currentUserAuth) {
    sb.from('perfiles').select('tema').eq('id', currentUserAuth.id).maybeSingle().then(({ data }) => {
      if (data?.tema) aplicarTema(data.tema);
    }).catch(() => {});
  }
}

async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUserAuth = session.user;
    return await loadUserProfile();
  }
  return false;
}

async function loadUserProfile() {
  if (!currentUserAuth) return false;
  lastAuthError = null;
  
  const { data: perfil, error: errPerfil } = await sb
    .from('perfiles')
    .select('*')
    .eq('id', currentUserAuth.id)
    .maybeSingle();
  if (errPerfil) {
    console.error('Error loading profile:', errPerfil);
    // La RPC de contexto no depende de las políticas SELECT de perfiles.
    const { data: centrosCtx, error: ctxError } = await sb.rpc('obtener_mis_centros');
    if (!ctxError && centrosCtx?.length) {
      const c = centrosCtx[0];
      state.centroId = c.centro_id;
      state.centroActual = { centro_id: c.centro_id, rol: c.rol, centros: { id: c.centro_id, nombre: c.centro_nombre, codigo_compartido: c.codigo_compartido } };
      state.centrosDisponibles = centrosCtx.map(m => ({ centro_id: m.centro_id, rol: m.rol, centros: { id: m.centro_id, nombre: m.centro_nombre, codigo_compartido: m.codigo_compartido } }));
      state.userProfile = { id: currentUserAuth.id, centro_id: c.centro_id, nombre_completo: currentUserAuth.email?.split('@')[0] || 'Usuario', rol: c.rol };
      await loadData();
      return true;
    }
    lastAuthError = 'No se pudo cargar tu perfil: ' + (errPerfil.message || 'error de permisos');
    return false;
  }
  
  if (!perfil) {
    return await createFirstUserProfile();
  }
  
  state.userProfile = perfil;
  await cargarCentrosDisponibles();
  
  if (state.centrosDisponibles.length > 0) {
    const primeraMembresia = state.centrosDisponibles.find(m => m.centro_id === perfil.centro_id) || state.centrosDisponibles[0];
    state.centroId = primeraMembresia.centro_id;
    state.centroActual = primeraMembresia;
    state.userProfile.rol = primeraMembresia.rol || perfil.rol || 'lector';
  } else if (perfil.centro_id) {
    // Compatibilidad con perfiles antiguos: si la membresía no aparece,
    // conservamos el centro del perfil y recuperamos sus datos por RPC.
    const { data: centroPerfil, error: centroPerfilError } = await sb.rpc('obtener_centro_por_id', { p_centro_id: perfil.centro_id });
    if (!centroPerfilError && centroPerfil) {
      const c = Array.isArray(centroPerfil) ? centroPerfil[0] : centroPerfil;
      state.centroId = perfil.centro_id;
      state.centroActual = {
        centro_id: perfil.centro_id,
        rol: perfil.rol || 'lector',
        centros: { id: perfil.centro_id, nombre: c?.nombre || 'Centro', codigo_compartido: c?.codigo_compartido || '' }
      };
      state.userProfile.rol = perfil.rol || 'lector';
    } else {
      state.centroId = perfil.centro_id;
      state.centroActual = {
        centro_id: perfil.centro_id,
        rol: ['administrador','coordinador','lector'].includes(perfil.rol) ? perfil.rol : 'lector',
        centros: { id: perfil.centro_id, nombre: 'Centro', codigo_compartido: '' }
      };
      state.userProfile.rol = ['administrador','coordinador','lector'].includes(perfil.rol) ? perfil.rol : 'lector';
    }
  }
  
  if (state.centroId) {
    await loadData();
    actualizarNombreHeader();
    actualizarSelectorCentro();
    return true;
  }
  
  lastAuthError = 'No tienes ningún centro asignado.';
  return false;
}

async function cargarCentrosDisponibles() {
  // La RPC es SECURITY DEFINER y además repara cuentas antiguas que
  // conservan perfiles.centro_id pero no tienen membresía.
  const { data, error } = await sb.rpc('obtener_mis_centros');
  if (error) {
    console.error('Error loading centros:', error);
    state.centrosDisponibles = [];
    return;
  }
  state.centrosDisponibles = (data || []).map(m => ({
    centro_id: m.centro_id,
    rol: ['administrador','coordinador','lector'].includes(m.rol) ? m.rol : 'lector',
    centros: {
      id: m.centro_id,
      nombre: m.centro_nombre || 'Centro',
      codigo_compartido: m.codigo_compartido || ''
    }
  }));
}

function actualizarSelectorCentro() {
  const wrap = document.getElementById('centro-selector-wrap');
  const select = document.getElementById('centro-selector');
  if (!wrap || !select) return;
  
  if (state.centrosDisponibles.length <= 1) {
    wrap.classList.add('hidden');
    return;
  }
  
  wrap.classList.remove('hidden');
  select.innerHTML = state.centrosDisponibles.map(m => 
    `<option value="${m.centros.id}" ${m.centros.id === state.centroId ? 'selected' : ''}>
      ${m.centros.nombre} (${m.rol})
    </option>`
  ).join('');
}

async function cambiarCentroActivo(centroId) {
  state.centroId = centroId;
  const membresia = state.centrosDisponibles.find(m => m.centros.id === centroId);
  if (membresia) {
    state.centroActual = membresia;
    state.userProfile.rol = membresia.rol;
  }
  await loadData();
  render();
  mostrarToast(`Centro cambiado a ${membresia?.centros.nombre || ''}`);
}

async function createFirstUserProfile() {
  if (!currentUserAuth) return false;
  
  const { data: centrosIniciales, error: errCentro } = await sb.rpc('obtener_centro_inicial');
  if (errCentro) {
    console.error('Error obteniendo centro inicial:', errCentro);
    lastAuthError = 'No se pudo localizar el centro inicial.';
    return false;
  }

  const centro = Array.isArray(centrosIniciales) ? centrosIniciales[0] : centrosIniciales;
  let centroId = centro?.id;
  if (!centroId) {
    const { data: newCentro, error: errNew } = await sb
      .from('centros')
      .insert({ nombre: 'Hospital Calatayud Limpieza' })
      .select('id, codigo_compartido')
      .single();
    if (errNew) {
      lastAuthError = 'No se pudo crear el centro inicial.';
      return false;
    }
    centroId = newCentro?.id;
  }

  if (!centroId) {
    lastAuthError = 'No hay centro disponible.';
    return false;
  }

  const { error: errPerfil } = await sb
    .from('perfiles')
    .insert({
      id: currentUserAuth.id,
      centro_id: centroId,
      nombre_completo: currentUserAuth.email?.split('@')[0] || 'Administrador',
      rol: 'administrador'
    });
  if (errPerfil) {
    lastAuthError = 'No se pudo crear tu perfil.';
    return false;
  }

  const { error: errMembresia } = await sb
    .from('miembros_centro')
    .insert({
      centro_id: centroId,
      user_id: currentUserAuth.id,
      rol: 'administrador'
    });
  if (errMembresia) {
    console.warn('Error creando membresía (puede que ya exista):', errMembresia);
  }

  mostrarToast('Perfil de administrador creado');
  return await loadUserProfile();
}

async function signIn(email, password) {
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { mostrarToast(error.message, true); return false; }
  currentUserAuth = data.user;
  const ok = await loadUserProfile();
  if (!ok) {
    renderLogin(lastAuthError || 'No se pudo cargar el perfil.');
    return false;
  }
  render();
  mostrarToast('Sesión iniciada');
  return true;
}

async function signUp(email, password, nombre) {
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { mostrarToast(error.message, true); return false; }
  if (!data.user) { mostrarToast('No se pudo crear el usuario.', true); return false; }

  if (!data.session) {
    renderLogin('Cuenta creada. Revisa tu correo y confirma el email antes de iniciar sesión.');
    return true;
  }

  currentUserAuth = data.user;
  let ok = await loadUserProfile();
  if (!ok && !state.userProfile) {
    const { data: centrosIniciales, error: centroError } = await sb.rpc('obtener_centro_inicial');
    const centro = Array.isArray(centrosIniciales) ? centrosIniciales[0] : centrosIniciales;
    const cid = centro?.id;
    if (centroError || !cid) {
      renderLogin('Cuenta creada. No existe todavía un centro al que unirte.');
      return false;
    }
    const { data: centroVacio, error: vacioError } = await sb.rpc('centro_sin_miembros', { p_centro_id: cid });
    if (vacioError) {
      renderLogin('Cuenta creada, pero no se pudo comprobar el estado del centro.');
      return false;
    }
    if (centroVacio === true) {
      const { error: perfilError } = await sb.from('perfiles').insert({
        id: data.user.id,
        centro_id: cid,
        nombre_completo: nombre || data.user.email?.split('@')[0] || 'Usuario',
        rol: 'administrador'
      });
      if (perfilError) {
        renderLogin('Cuenta creada, pero no se pudo crear tu perfil.');
        return false;
      }
      const { error: membresiaError } = await sb.from('miembros_centro').insert({
        centro_id: cid,
        user_id: data.user.id,
        rol: 'administrador'
      });
      if (membresiaError) {
        renderLogin('Cuenta creada, pero no se pudo crear tu membresía.');
        return false;
      }
      ok = await loadUserProfile();
    } else {
      renderLogin('Cuenta creada. Inicia sesión y únete a tu centro con el código compartido.');
      return true;
    }
  }
  if (!ok) {
    renderLogin(lastAuthError || 'No se pudo completar el registro.');
    return false;
  }
  render();
  mostrarToast('Usuario registrado');
  return true;
}

async function signOut() {
  await sb.auth.signOut();
  currentUserAuth = null;
  state.userProfile = null;
  state.centroId = null;
  state.centrosDisponibles = [];
  if (realtimeChannel) {
    sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  renderLogin();
  mostrarToast('Sesión cerrada');
}

async function loadData() {
  if (!state.centroId) return;
  await Promise.all([
    loadTrabajadores(),
    loadZonas(),
    loadTareas(),
    loadTurnos(),
    loadParametros(),
    loadSolicitudesAusencia()
  ]);
  render();
  setupRealtime();
}

async function loadTrabajadores() {
  let query = sb.from('trabajadores').select('*').eq('centro_id', state.centroId).order('orden', { ascending: true });
  if (!tieneRol('coordinador')) {
    const trabajadorId = state.userProfile?.trabajador_id;
    if (!trabajadorId) { state.trabajadores = []; return; }
    query = query.eq('id', trabajadorId);
  }
  const { data, error } = await query;
  if (error) { console.error('Error loading trabajadores:', error); return; }
  state.trabajadores = data || [];
}

async function loadZonas() {
  if (!tieneRol('coordinador')) { state.zonas = []; return; }
  const { data, error } = await sb
    .from('zonas')
    .select('*')
    .eq('centro_id', state.centroId)
    .order('orden', { ascending: true });
  if (error) { console.error('Error loading zonas:', error); return; }
  state.zonas = data || [];
}

async function loadTareas() {
  if (!tieneRol('coordinador')) { state.tareas = []; return; }
  const { data, error } = await sb.from('tareas').select('*, tarea_asignados(trabajador_id)').eq('centro_id', state.centroId);
  if (error) { console.error('Error loading tareas:', error); return; }
  state.tareas = (data || []).map(t => ({ ...t, asignados: (t.tarea_asignados || []).map(a => a.trabajador_id) }));
}

async function loadTurnos(mesParam, anioParam) {
  const mes = mesParam ?? state.mesActual;
  const anio = anioParam ?? state.anio;
  const fechaInicio = `${anio}-${String(mes+1).padStart(2,'0')}-01`;
  const fechaFin = `${anio}-${String(mes+1).padStart(2,'0')}-${String(diasEnMes(mes, anio)).padStart(2,'0')}`;
  
  let query = sb.from('turnos').select('*').eq('centro_id', state.centroId).gte('fecha', fechaInicio).lte('fecha', fechaFin);
  if (!tieneRol('coordinador')) {
    const trabajadorId = state.userProfile?.trabajador_id;
    if (!trabajadorId) { state.turnos[clavesMes(mes, anio)] = {}; return; }
    query = query.eq('trabajador_id', trabajadorId);
  }
  const { data, error } = await query;
  if (error) { console.error('Error loading turnos:', error); return; }
  
  const key = clavesMes(mes, anio);
  state.turnos[key] = {};
  (data || []).forEach(t => {
    if (!state.turnos[key][t.trabajador_id]) {
      state.turnos[key][t.trabajador_id] = {};
    }
    const dia = parseInt(String(t.fecha).slice(8, 10), 10);
    state.turnos[key][t.trabajador_id][dia - 1] = t.codigo;
  });
}

async function loadParametros() {
  const { data, error } = await sb
    .from('centros')
    .select('*')
    .eq('id', state.centroId)
    .maybeSingle();
  if (error) { console.error('Error loading parametros:', error); return; }
  if (data) {
    state.parametros = {
      ...state.parametros,
      jornadaMaxDiaria: data.jornada_max_diaria || 9,
      jornadaMinDiaria: data.jornada_min_diaria || 7,
      jornadaMaxSemanal: data.jornada_max_semanal || 35,
      maxDiasSeguidos: data.max_dias_seguidos || 6,
      preavisoDias: data.preaviso_dias || 5,
      jornadaAnualDiurna: data.jornada_anual_diurna || 1519,
      jornadaAnualNocturna: data.jornada_anual_nocturna || 1350,
      vacacionesAnuales: data.vacaciones_anuales || 22,
      presupuestoMensual: Number(data.presupuesto_mensual || 0),
      convenioVencido: data.convenio_vencido || false,
      convenioTexto: data.convenio_texto || 'Convenio Limpieza Hospitalaria SALUD Aragón'
    };
  }
}

async function loadSolicitudesAusencia() {
  if (!state.centroId) return;
  let query = sb.from('solicitudes_ausencia').select('*').eq('centro_id', state.centroId).order('creado_en', { ascending: false });
  if (!tieneRol('coordinador')) {
    const trabajadorId = state.userProfile?.trabajador_id;
    if (!trabajadorId) { state.solicitudesAusencia = []; return; }
    query = query.eq('trabajador_id', trabajadorId);
  }
  const { data, error } = await query;
  if (error) { console.warn('No se pudieron cargar solicitudes:', error); state.solicitudesAusencia = []; return; }

}

// ============================================================
// REALTIME
// ============================================================
function setupRealtime() {
  if (realtimeChannel) {
    sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  
  if (!state.centroId) return;
  
  realtimeChannel = sb
    .channel('turnos-changes')
    .on(
      'postgres_changes',
      {
        event: '*',
        schema: 'public',
        table: 'turnos',
        filter: `centro_id=eq.${state.centroId}`
      },
      (payload) => {
        if (payload.new?.editado_por === currentUserAuth?.id) return;
        if (payload.old?.editado_por === currentUserAuth?.id) return;
        handleTurnoChange(payload);
      }
    )
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        const sub = document.getElementById('header-sub');
        if (sub) sub.textContent += ' · En directo';
      }
    });
}

function handleTurnoChange(payload) {
  const registro = payload.eventType === 'DELETE' ? payload.old : payload.new;
  if (!registro) return;
  const partesFecha = String(registro.fecha).slice(0, 10).split('-').map(Number);
  const anio = partesFecha[0];
  const mes = partesFecha[1] - 1;
  const dia = partesFecha[2];
  const key = clavesMes(mes, anio);
  if (!state.turnos[key]) state.turnos[key] = {};
  if (!state.turnos[key][registro.trabajador_id]) state.turnos[key][registro.trabajador_id] = {};

  if (payload.eventType === 'DELETE') {
    delete state.turnos[key][registro.trabajador_id][dia - 1];
  } else {
    state.turnos[key][registro.trabajador_id][dia - 1] = registro.codigo;
  }

  if (mes === state.mesActual && anio === state.anio && currentView === 'cuadrante') {
    actualizarCeldaEnTabla(registro.trabajador_id, dia - 1, payload.eventType === 'DELETE' ? '' : registro.codigo);
    mostrarToast('Cuadrante actualizado por otro usuario');
  }
}

// ============================================================
// FUNCIONES CUADRANTE
// ============================================================
function getTurno(trabajadorId, dia, mes, anio) {
  const key = clavesMes(mes ?? state.mesActual, anio ?? state.anio);
  return state.turnos[key]?.[trabajadorId]?.[dia] || '';
}

async function setCelda(trabajadorId, dia, valor, mes, anio) {
  if (!tieneRol('coordinador')) {
    mostrarToast('Solo el Encargado o el Gestor pueden modificar el cuadrante', true);
    return false;
  }
  mes = mes ?? state.mesActual;
  anio = anio ?? state.anio;
  const fecha = `${anio}-${String(mes+1).padStart(2,'0')}-${String(dia+1).padStart(2,'0')}`;
  const key = clavesMes(mes, anio);
  const anterior = getTurno(trabajadorId, dia, mes, anio);
  
  let error;
  if (valor === '') {
    const { error: delError } = await sb
      .from('turnos')
      .delete()
      .match({ centro_id: state.centroId, trabajador_id: trabajadorId, fecha });
    error = delError;
  } else {
    const { error: upsertError } = await sb
      .from('turnos')
      .upsert({
        centro_id: state.centroId,
        trabajador_id: trabajadorId,
        fecha: fecha,
        codigo: valor,
        editado_por: currentUserAuth?.id
      }, { onConflict: 'centro_id,trabajador_id,fecha' });
    error = upsertError;
  }
  
  if (error) {
    console.error('Error guardando turno:', error);
    mostrarToast('Error al guardar', true);
    return false;
  }
  
  if (!state.turnos[key]) state.turnos[key] = {};
  if (!state.turnos[key][trabajadorId]) state.turnos[key][trabajadorId] = {};
  if (valor === '') {
    delete state.turnos[key][trabajadorId][dia];
  } else {
    state.turnos[key][trabajadorId][dia] = valor;
  }
  
  undoStack.push({ trabajadorId, dia, mes, anio, anterior, nuevo: valor });
  if (undoStack.length > 20) undoStack.shift();

  if (anterior !== valor && currentUserAuth?.id && state.centroId) {
    sb.from('historial_cambios').insert({
      centro_id: state.centroId,
      trabajador_id: trabajadorId,
      usuario_id: currentUserAuth.id,
      usuario_nombre: state.userProfile?.nombre_completo || 'Usuario',
      fecha_turno: fecha,
      valor_anterior: anterior || null,
      valor_nuevo: valor || null
    }).then(() => {}).catch(() => {});
  }

  if (currentView === 'cuadrante') {
    actualizarCeldaEnTabla(trabajadorId, dia, valor);
  }
  mostrarToast('Turno actualizado');
  return true;
}

function actualizarCeldaEnTabla(trabajadorId, columna, valor) {
  const celda = document.getElementById(`celda-${trabajadorId}-${columna}`);
  if (celda) {
    const t = state.trabajadores.find(w => w.id === trabajadorId);
    const esFest = t ? esFestivo(state.anio, state.mesActual, columna + 1) : false;
    const esFinde = t ? esFinDeSemana(columna + 1, state.mesActual, state.anio) : false;
    celda.textContent = valor + (esFest && valor && !['L','D','V','VAC','VA'].includes(valor) ? '🌟' : '');
    celda.className = claseCelda(valor, esFinde, esFest);
    const totalCelda = document.getElementById(`total-${trabajadorId}`);
    if (totalCelda && t) totalCelda.textContent = getTotalHorasMes(t.id, state.mesActual, state.anio);
  }
}

function claseCelda(valor, esFinde, esFest) {
  const clases = ['editable-cell'];
  if (valor) {
    if (valor.startsWith('F') && valor !== 'F') clases.push('F1');
    else clases.push(valor);
  }
  if (esFinde) clases.push('wkend');
  if (esFest && valor && valor !== 'L' && valor !== 'D') clases.push('festivo-cell');
  return clases.join(' ');
}

function getTotalHorasMes(trabajadorId, mes, anio) {
  mes = mes ?? state.mesActual;
  anio = anio ?? state.anio;
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key];
  if (!turnos || !turnos[trabajadorId]) return 0;
  
  let total = 0;
  const dias = diasEnMes(mes, anio);
  const t = state.trabajadores.find(w => w.id === trabajadorId);
  for (let d = 0; d < dias; d++) {
    const valor = turnos[trabajadorId][d] || '';
    if (valor !== '') {
      total += horasCodigo(valor);
    } else {
      if (t?.grupo === 'manana' || t?.grupo === 'tarde') {
        total += 7;
      }
    }
  }
  return total;
}

function getTotalHorasAnio(trabajadorId, anio) {
  anio = anio ?? state.anio;
  let total = 0;
  for (let m = 0; m < 12; m++) total += getTotalHorasMes(trabajadorId, m, anio);
  return total;
}

function getMaxDiasSeguidos(trabajadorId, mes, anio) {
  mes = mes ?? state.mesActual;
  anio = anio ?? state.anio;
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key];
  if (!turnos || !turnos[trabajadorId]) return 0;
  
  let max = 0, actual = 0;
  const dias = diasEnMes(mes, anio);
  for (let d = 0; d < dias; d++) {
    const v = turnos[trabajadorId][d] || '';
    const trabajado = v && v !== 'L' && v !== 'D' && v !== 'V' && v !== 'VAC' && v !== 'VA' && v !== '';
    if (trabajado) { actual++; max = Math.max(max, actual); }
    else actual = 0;
  }
  return max;
}

function getVacacionesDisfrutadas(trabajadorId, anio) {
  anio = anio ?? state.anio;
  let dias = 0;
  for (let m = 0; m < 12; m++) {
    const key = clavesMes(m, anio);
    const turnos = state.turnos[key];
    if (!turnos || !turnos[trabajadorId]) continue;
    for (let d = 0; d < diasEnMes(m, anio); d++) {
      const v = turnos[trabajadorId][d] || '';
      if (v === 'V' || v === 'VAC' || v === 'VA') dias++;
    }
  }
  return dias;
}

function coberturaDelDia(dia, mes, anio) {
  const key = clavesMes(mes ?? state.mesActual, anio ?? state.anio);
  const turnos = state.turnos[key];
  if (!turnos) return { M: 0, T: 0, N: 0 };
  
  const result = { M: 0, T: 0, N: 0 };
  state.trabajadores.forEach(t => {
    if (t.estado === 'baja') return;
    const v = turnos[t.id]?.[dia] || '';
    if (t.grupo === 'manana' && v === '') result.M++;
    else if (t.grupo === 'tarde' && v === '') result.T++;
    else if (v === 'M') result.M++;
    else if (v === 'T') result.T++;
    else if (v === 'N') result.N++;
  });
  return result;
}

function obtenerIncidenciasLegalesTrabajador(t, mes, anio) {
  const incidencias = [];
  const dias = diasEnMes(mes, anio);
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key]?.[t.id] || {};
  let seg = 0;
  let semanaHoras = 0;
  let semanaInicio = null;
  for (let d = 0; d < dias; d++) {
    const fecha = new Date(anio, mes, d + 1);
    const lunes = new Date(fecha);
    const dow = fecha.getDay() || 7;
    lunes.setDate(fecha.getDate() - dow + 1);
    const semanaKey = `${lunes.getFullYear()}-${lunes.getMonth()}-${lunes.getDate()}`;
    if (semanaKey !== semanaInicio) {
      if (semanaInicio !== null && semanaHoras > state.parametros.jornadaMaxSemanal) incidencias.push(`${t.nombre}: ${semanaHoras}h en una semana (máx. ${state.parametros.jornadaMaxSemanal}h)`);
      semanaInicio = semanaKey; semanaHoras = 0;
    }
    const valor = turnos[d] || '';
    const horas = horasCodigo(valor);
    if (horas > 0) {
      if (horas > state.parametros.jornadaMaxDiaria) incidencias.push(`${t.nombre}: ${horas}h el día ${d + 1} (máx. diario ${state.parametros.jornadaMaxDiaria}h)`);
      if (horas < state.parametros.jornadaMinDiaria) incidencias.push(`${t.nombre}: ${horas}h el día ${d + 1} (mín. diario ${state.parametros.jornadaMinDiaria}h)`);
      seg++;
      if (seg > state.parametros.maxDiasSeguidos) incidencias.push(`${t.nombre}: ${seg} días seguidos trabajados al llegar al día ${d + 1} (máx. ${state.parametros.maxDiasSeguidos})`);
      semanaHoras += horas;
    } else {
      seg = 0;
    }
  }
  if (semanaHoras > state.parametros.jornadaMaxSemanal) incidencias.push(`${t.nombre}: ${semanaHoras}h en una semana (máx. ${state.parametros.jornadaMaxSemanal}h)`);
  return incidencias;
}

function validarCuadranteCompleto() {
  const incidencias = [];
  const mes = state.mesActual;
  const anio = state.anio;
  state.trabajadores.filter(t => t.estado === 'activo').forEach(t => incidencias.push(...obtenerIncidenciasLegalesTrabajador(t, mes, anio)));
  return [...new Set(incidencias)];
}

function togglePasswordVisibility() {

  pass.type = pass.type === 'password' ? 'text' : 'password';
}

let loginMode = 'login';
function toggleLoginMode() {
  loginMode = loginMode === 'login' ? 'register' : 'login';
  const form = document.getElementById('login-form');
  const email = document.getElementById('login-email');
  const btn = form.querySelector('.btn-primary');
  const btn2 = form.querySelector('.btn-secondary');
  const switchLink = form.querySelector('.switch a');

  if (loginMode === 'register') {
    const niNombre = document.createElement('input');
    niNombre.id = 'login-nombre';
    niNombre.type = 'text';
    niNombre.placeholder = 'Nombre';
    niNombre.className = 'modal-input';
    niNombre.style.marginBottom = '8px';

    const niApellido = document.createElement('input');
    niApellido.id = 'login-apellido';
    niApellido.type = 'text';
    niApellido.placeholder = 'Apellido';
    niApellido.className = 'modal-input';
    niApellido.style.marginBottom = '12px';

    form.insertBefore(niApellido, email);
    form.insertBefore(niNombre, niApellido);
    btn.textContent = 'Registrarse';
    btn.onclick = handleRegister;
    btn2.style.display = 'none';
    switchLink.textContent = 'Ya tengo cuenta';
    switchLink.onclick = toggleLoginMode;
  } else {
    document.getElementById('login-nombre')?.remove();
    document.getElementById('login-apellido')?.remove();
    btn.textContent = 'Iniciar sesión';
    btn.onclick = handleLogin;
    btn2.style.display = '';
    switchLink.textContent = 'Regístrate aquí';
    switchLink.onclick = toggleLoginMode;
  }
}

async function handleLogin() {
  const email = document.getElementById('login-email')?.value.trim();
  const pass = document.getElementById('login-password')?.value;
  if (!email || !pass) { mostrarToast('Email y contraseña requeridos', true); return; }
  const btn = document.getElementById('login-submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Entrando...'; }
  try { await signIn(email, pass); }
  finally { if (btn) { btn.disabled = false; btn.textContent = 'Iniciar sesión'; } }
}

async function handleRegister() {
  const email = document.getElementById('login-email')?.value.trim();
  const pass = document.getElementById('login-password')?.value;
  const nombre = document.getElementById('login-nombre')?.value?.trim();
  const apellido = document.getElementById('login-apellido')?.value?.trim();
  if (!email || !pass || !nombre || !apellido) {
    mostrarToast('Rellena nombre, apellido, email y contraseña', true);
    return;
  }
  if (pass.length < 6) { mostrarToast('La contraseña debe tener al menos 6 caracteres', true); return; }
  const btn = document.getElementById('login-register-btn') || document.querySelector('#login-form .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Registrando...'; }
  try { await signUp(email, pass, `${nombre} ${apellido}`); }
  finally { if (btn) { btn.disabled = false; } }
}

}

function mostrarEventosDia(anio, mes, dia) {
  const eventos = [];
  state.tareas.forEach(t => {
    const fechaT = new Date(t.fecha);
    if (!t.completada && fechaT.getDate() === dia && fechaT.getMonth() === mes && fechaT.getFullYear() === anio) {
      eventos.push({ tipo: 'tarea', nombre: t.nombre, emoji: t.prioridad === 'rojo' ? '🔴' : '🟡', descripcion: t.prioridad, color: t.prioridad });
    }
  });
  if (esFestivo(anio, mes, dia)) {
    const fest = getNombreFestivo(anio, mes, dia);
    eventos.push({ tipo: 'festivo', nombre: fest.nombre, emoji: '🌟', descripcion: 'Día festivo', color: 'verde' });
  }
  if (eventos.length === 0) { mostrarToast('No hay eventos este día'); return; }
  const fechaStr = `${dia} de ${MESES_NOMBRES[mes]} de ${anio}`;
  let eventosHtml = `<div class="eventos-list">`;
  eventos.forEach(ev => {
    let bgColor = ev.color === 'rojo' ? 'background:var(--danger-bg);color:var(--danger)' : ev.color === 'amber' ? 'background:var(--warning-bg);color:var(--warning)' : 'background:var(--success-bg);color:var(--success)';
    eventosHtml += `<div class="evento-item"><div class="evento-emoji">${ev.emoji}</div><div class="evento-info"><div class="evento-titulo">${ev.nombre}</div><div class="evento-desc">${ev.descripcion}</div></div><div class="evento-badge" style="${bgColor}">${ev.tipo}</div></div>`;
  });
  eventosHtml += `</div>`;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box centered"><div class="modal-title">${fechaStr}</div>${eventosHtml}<div class="modal-btns"><button class="btn-modal-cancel" onclick="cerrarModal()">Cerrar</button></div></div>`;
  document.body.appendChild(overlay);
}

async function copiarMesAnterior() {
  if (!tieneRol('coordinador')) return;
  const mesDestino = state.mesActual, anioDestino = state.anio;
  const fechaAnterior = new Date(anioDestino, mesDestino, 0);
  const mesOrigen = fechaAnterior.getMonth(), anioOrigen = fechaAnterior.getFullYear();
  if (!confirm(`Copiar los turnos de ${MESES_NOMBRES[mesOrigen]} ${anioOrigen} a ${MESES_NOMBRES[mesDestino]} ${anioDestino}? Solo se copiarán las celdas con turno asignado y se sobrescribirán esas mismas celdas.`)) return;
  const { data, error } = await sb.from('turnos').select('*').eq('centro_id', state.centroId)
    .gte('fecha', `${anioOrigen}-${String(mesOrigen+1).padStart(2,'0')}-01`)
    .lte('fecha', `${anioOrigen}-${String(mesOrigen+1).padStart(2,'0')}-${String(diasEnMes(mesOrigen,anioOrigen)).padStart(2,'0')}`);
  if (error) { mostrarToast('No se pudo leer el mes anterior', true); return; }
  const diasDestino = diasEnMes(mesDestino, anioDestino);
  const filas = (data || []).map(r => {
    const diaOrigen = parseInt(String(r.fecha).slice(8,10),10);
    if (diaOrigen > diasDestino || !r.codigo) return null;
    return { centro_id: state.centroId, trabajador_id: r.trabajador_id, fecha: `${anioDestino}-${String(mesDestino+1).padStart(2,'0')}-${String(diaOrigen).padStart(2,'0')}`, codigo: r.codigo, editado_por: currentUserAuth?.id };
  }).filter(Boolean);
  for (let i=0;i<filas.length;i+=100) { const {error:e}=await sb.from('turnos').upsert(filas.slice(i,i+100),{onConflict:'centro_id,trabajador_id,fecha'}); if(e){mostrarToast('Error copiando el cuadrante',true);return;} }
  await loadTurnos(mesDestino,anioDestino); renderCuadrante(); mostrarToast(`${filas.length} turnos copiados del mes anterior`);
}

async function enviarSolicitudAusencia() {
  const t=obtenerTrabajadorActual(); if(!t)return;
  const tipo=document.getElementById('sol-tipo')?.value, inicio=document.getElementById('sol-inicio')?.value, fin=document.getElementById('sol-fin')?.value, motivo=document.getElementById('sol-motivo')?.value?.trim()||'';
  if(!inicio||!fin||fin<inicio){mostrarToast('Indica un periodo válido',true);return;}
  const {error}=await sb.from('solicitudes_ausencia').insert({centro_id:state.centroId,trabajador_id:t.id,solicitante_id:currentUserAuth.id,tipo,fecha_inicio:inicio,fecha_fin:fin,motivo,estado:'pendiente'});
  if(error){mostrarToast('No se pudo enviar la solicitud',true);return;}
  await loadSolicitudesAusencia(); cerrarModal(); render(); mostrarToast('Solicitud enviada al gestor');
}

async function resolverSolicitud(id, estado) {
  if(!tieneRol('coordinador'))return;
  const s=state.solicitudesAusencia.find(x=>x.id===id); if(!s)return;
  const comentario=estado==='rechazada' ? (prompt('Motivo del rechazo (opcional):')||'') : '';
  if(estado==='rechazada' && !confirm('¿Rechazar esta solicitud?')) return;
  if(estado==='aprobada' && !confirm('¿Aprobar y reflejar automáticamente la ausencia en el cuadrante?')) return;
  const {error}=await sb.from('solicitudes_ausencia').update({estado,aprobado_por:currentUserAuth.id,fecha_resolucion:new Date().toISOString(),comentario_gestor:comentario}).eq('id',id).eq('centro_id',state.centroId);
  if(error){mostrarToast('No se pudo resolver la solicitud',true);return;}
  if(estado==='aprobada'){
    const t=state.trabajadores.find(x=>x.id===s.trabajador_id); if(!t){mostrarToast('Trabajador no encontrado',true);return;}
    const d0=new Date(`${s.fecha_inicio}T12:00:00`), d1=new Date(`${s.fecha_fin}T12:00:00`);
    const codigo=s.tipo==='vacaciones'?'V':s.tipo==='permiso'?'PR':'CF';
    for(let d=new Date(d0);d<=d1;d.setDate(d.getDate()+1)){ await setCelda(t.id,d.getDate()-1,codigo,d.getMonth(),d.getFullYear()); }
  }
  await loadSolicitudesAusencia(); await loadTurnos(state.mesActual,state.anio); render(); mostrarToast(estado==='aprobada'?'Solicitud aprobada y cuadrante actualizado':'Solicitud rechazada');
}

function getHorasAsignadasMes(trabajadorId, mes, anio) {
  const map=state.turnos[clavesMes(mes,anio)]?.[trabajadorId]||{};
  let total=0; for(let d=0;d<diasEnMes(mes,anio);d++) total += horasCodigo(map[d]||''); return total;
}

function calcularCosteMes(mes,anio,trabajadores=state.trabajadores) {
  return trabajadores.reduce((sum,t)=>sum + getTotalHorasMes(t.id,mes,anio)*Number(t.coste_hora||0),0);
}

async function cargarTurnosAnio(ano) {
  const ini=`${ano}-01-01`, fin=`${ano}-12-31`;
  const {data,error}=await sb.from('turnos').select('trabajador_id,fecha,codigo').eq('centro_id',state.centroId).gte('fecha',ini).lte('fecha',fin);
  if(error) throw error;
  const backup=state.turnos;
  for(const m of Object.keys(backup)) { if(String(m).startsWith(String(ano)+'-')) delete backup[m]; }
  (data||[]).forEach(r=>{const [y,mo,dd]=String(r.fecha).slice(0,10).split('-').map(Number), key=clavesMes(mo-1,y); if(!state.turnos[key])state.turnos[key]={}; if(!state.turnos[key][r.trabajador_id])state.turnos[key][r.trabajador_id]={}; state.turnos[key][r.trabajador_id][dd-1]=r.codigo;});
}

async function renderAnalitica() {
  if(!tieneRol('coordinador')){showView('cuadrante');return;}
  const content=document.getElementById('content'); if(!content)return;
  content.innerHTML='<div class="card"><div class="card-body"><div class="empty">Calculando analítica…</div></div></div>';
  try { await cargarTurnosAnio(state.anio); } catch(e){content.innerHTML='<div class="card"><div class="card-body"><div class="empty">No se pudo cargar la analítica.</div></div></div>';return;}
  const meses=MESES_NOMBRES.map((nombre,m)=>{let horas=0,coste=0,it=0,he=0,heHoras=0;state.trabajadores.forEach(t=>{const map=state.turnos[clavesMes(m,state.anio)]?.[t.id]||{};for(let d=0;d<diasEnMes(m,state.anio);d++){const v=map[d]||'';if(v)horas+=horasCodigo(v);if(v==='IT')it++;if(v==='HE')he++; if(/^HE\d+(?:[.,]\d+)?$/.test(v)) heHoras+=parseFloat(v.slice(2).replace(',', '.'));} coste+=getTotalHorasMes(t.id,m,state.anio)*Number(t.coste_hora||0);});return{nombre,horas,coste,it,he,heHoras};});
  const totalHoras=meses.reduce((a,m)=>a+m.horas,0), totalCoste=meses.reduce((a,m)=>a+m.coste,0), totalIT=meses.reduce((a,m)=>a+m.it,0), totalHE=meses.reduce((a,m)=>a+m.he,0), totalHEHoras=meses.reduce((a,m)=>a+m.heHoras,0);
  const rotacionAltas=state.trabajadores.filter(t=>t.created_at&&new Date(t.created_at).getFullYear()===state.anio).length;
  const rotacionBajas=state.trabajadores.filter(t=>t.fecha_baja&&new Date(t.fecha_baja).getFullYear()===state.anio).length;
  const plantillaMedia=state.trabajadores.length || 1;
  const rotacionPct=((rotacionAltas+rotacionBajas)/(2*plantillaMedia)*100);
  const diasTrabajados=meses.reduce((sum,m)=>sum + state.trabajadores.reduce((st,t)=>{const map=state.turnos[clavesMes(m,state.anio)]?.[t.id]||{};return st+Object.values(map).filter(v=>{const h=horasCodigo(v);return h>0;}).length;},0),0);
  const tasaAbsentismo=totalIT/(totalIT+diasTrabajados||1)*100;
  const tabla=meses.map(m=>`<tr><td>${m.nombre}</td><td>${m.horas}h</td><td>${m.coste.toFixed(2)} €</td><td>${m.it}</td><td>${m.heHoras.toFixed(1)}</td></tr>`).join('');
  const presupuesto=Number(state.parametros.presupuestoMensual||0);
  content.innerHTML=`<div class="card"><div class="card-header">Analítica ${state.anio}</div><div class="card-body"><div class="metric-grid"><div class="metric-card"><div class="metric-value">${totalHoras}h</div><div class="metric-label">Horas planificadas</div></div><div class="metric-card"><div class="metric-value">${totalCoste.toFixed(2)} €</div><div class="metric-label">Coste laboral acumulado</div></div><div class="metric-card"><div class="metric-value">${totalIT}</div><div class="metric-label">Días IT · ${tasaAbsentismo.toFixed(1)}% tasa</div></div><div class="metric-card"><div class="metric-value">${totalHEHoras.toFixed(1)}h</div><div class="metric-label">Horas extra codificadas (HE2, HE3...)</div></div><div class="metric-card"><div class="metric-value">${rotacionAltas}/${rotacionBajas}</div><div class="metric-label">Altas / bajas · rotación ${rotacionPct.toFixed(1)}%</div></div></div></div></div><div class="card"><div class="card-header">Comparativa mensual</div><div class="card-body"><div style="overflow:auto"><table style="width:100%;font-size:11px"><thead><tr><th>Mes</th><th>Horas</th><th>Coste</th><th>IT</th><th>HE (h)</th></tr></thead><tbody>${tabla}</tbody></table></div></div></div><div class="card"><div class="card-header">Presupuesto</div><div class="card-body"><div style="font-size:12px">Presupuesto mensual configurado: <strong>${presupuesto.toFixed(2)} €</strong></div>${presupuesto?meses.map(m=>{const diff=m.coste-presupuesto;return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px"><span>${m.nombre}</span><strong style="color:${diff>0?'var(--danger)':'var(--success)'}">${diff>0?'+':''}${diff.toFixed(2)} €</strong></div>`}).join(''):'<div class="empty">Configura un presupuesto mensual en Ajustes para comparar.</div>'}</div></div>`;
}

  }
  html += `<div class="aviso aviso-gris" style="margin-bottom:8px;font-size:11px">${tieneRol('coordinador') ? `Pulsa una celda para cambiar el turno · Preaviso legal: ${state.parametros.preavisoDias} días` : 'Modo consulta · Solo puedes consultar tu propio horario y gestionar tus solicitudes'}</div>`;
  html += `<div class="wrap"><table><thead><tr><th style="border:0.5px solid var(--border);padding:6px 4px;text-align:left;position:sticky;left:0;background:var(--surface-alt);min-width:180px;">Trabajador</th>`;
  for (let d = 1; d <= dias; d++) {

    html += `<th style="border:0.5px solid var(--border);padding:6px 2px;text-align:center;${fds ? 'background:var(--surface-alt);' : ''}${fest ? 'background:var(--warning-bg);' : ''}">${d}</th>`;
  }
  html += `<th style="border:0.5px solid var(--border);padding:6px 4px;text-align:center;background:var(--info-bg);position:sticky;right:0;">H</th></tr></thead><tbody id="cuad-tbody">`;
  
  const filtrados = state.trabajadores.filter(t => t.nombre.toLowerCase().includes(cuadFiltro.toLowerCase()));
  for (let idx = 0; idx < filtrados.length; idx++) {
    const t = filtrados[idx];
    const total = getTotalHorasMes(t.id, mes, anio);
    const seg = getMaxDiasSeguidos(t.id, mes, anio);
    const bolsa = getTotalHorasAnio(t.id) - state.parametros.jornadaAnualDiurna;
    let rowStyle = '';
    if (t.estado === 'baja') rowStyle = 'opacity:0.55; background:var(--danger-bg);';
    if (t.tipo === 'sustituto') rowStyle = 'color:var(--danger);';

    for (let d = 0; d < dias; d++) {

  }
  
  html += `<tr style="background:var(--success-bg);font-weight:700;"><td style="border:0.5px solid var(--border);padding:4px 6px;text-align:left;position:sticky;left:0;background:var(--success-bg);">Cobertura M/T/N</td>`;
  for (let d = 0; d < dias; d++) {
    const cob = coberturaDelDia(d, mes, anio);
    let deficit = false;
    for (const zona of state.zonas) {
      if ((zona.cobertura_min_m > 0 && (cob.M || 0) < zona.cobertura_min_m) ||
          (zona.cobertura_min_t > 0 && (cob.T || 0) < zona.cobertura_min_t) ||
          (zona.cobertura_min_n > 0 && (cob.N || 0) < zona.cobertura_min_n)) deficit = true;
    }
    html += `<td style="${deficit ? 'border:0.5px solid var(--border);padding:4px 2px;text-align:center;background:var(--danger-bg);color:var(--danger);' : 'border:0.5px solid var(--border);padding:4px 2px;text-align:center;'}">${cob.M}/${cob.T}/${cob.N}</td>`;
  }
  html += `<td style="border:0.5px solid var(--border);padding:4px 2px;text-align:center;background:var(--success-bg);"></td></tr>`;
  html += `</tbody></table></div>`;

  html += `<div class="card" style="margin-top:12px">
    <div class="card-header">Comentarios del cuadrante — ${MESES_NOMBRES[mes]} ${anio}</div>
    <div class="card-body" id="comentarios-lista"><div class="empty">Cargando…</div></div>

        <button class="btn btn-primary btn-sm" onclick="guardarComentario()">Publicar comentario</button>
      </div>` : ''}
  </div>`;

  content.innerHTML = html;
  actualizarNombreHeader();
  cargarComentarios();
}

  clearTimeout(filtroCuadranteTimeout);

function mostrarAlertasCuadrante() {
  const incidencias = validarCuadranteCompleto();
  if (incidencias.length === 0) { alert('No se encontraron incidencias en el cuadrante'); return; }
  alert('Incidencias detectadas:\n\n' + incidencias.join('\n'));
}

async function vaciarCuadranteActual() {
  if (!tieneRol('coordinador')) { mostrarToast('Solo el Encargado o el Gestor pueden vaciar el cuadrante', true); return; }
  if (!confirm(`¿Estás seguro de que quieres VACIAR completamente el cuadrante de ${MESES_NOMBRES[state.mesActual]} ${state.anio}?`)) return;
  const mes = state.mesActual;
  const anio = state.anio;
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key] || {};
  const operaciones = [];
  for (const trabajadorId in turnos) {
    for (const dia in turnos[trabajadorId]) {
      operaciones.push(setCelda(trabajadorId, parseInt(dia, 10), '', mes, anio));
    }
  }
  const resultados = await Promise.all(operaciones);
  const errores = resultados.filter(ok => ok !== true).length;
  if (errores) mostrarToast(`El cuadrante se vació con ${errores} errores`, true);
  else mostrarToast(`Cuadrante de ${MESES_NOMBRES[mes]} vaciado`);
}

}

async function undoUltimoCambio() {
  if (!undoStack.length) { mostrarToast('No hay cambios que deshacer'); return; }
  const cambio = undoStack.pop();
  const ok = await setCelda(cambio.trabajadorId, cambio.dia, cambio.anterior, cambio.mes, cambio.anio);
  if (!ok) {
    undoStack.push(cambio);
    return;
  }
  mostrarToast('Cambio deshecho');
}

    <label class="modal-label">Notas</label><textarea class="modal-input" id="z-notas" rows="2">${z?.notas || ''}</textarea>
    <div class="modal-btns"><button class="btn-modal-ok" onclick="guardarZona('${id || ''}')">Guardar</button><button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button></div>
  </div>`;
  document.body.appendChild(overlay);
}

async function guardarZona(id) {
  if (!tieneRol('coordinador')) { mostrarToast('No tienes permiso para modificar zonas', true); return; }
  const nombre = document.getElementById('z-nombre')?.value?.trim();
  if (!nombre) { mostrarToast('Nombre requerido', true); return; }
  const cobertura_min_m = parseInt(document.getElementById('z-cob-M')?.value) || 0;
  const cobertura_min_t = parseInt(document.getElementById('z-cob-T')?.value) || 0;
  const cobertura_min_n = parseInt(document.getElementById('z-cob-N')?.value) || 0;
  const notas = document.getElementById('z-notas')?.value || '';
  
  if (id) {
    const { error } = await sb.from('zonas').update({ nombre, cobertura_min_m, cobertura_min_t, cobertura_min_n, notas }).eq('id', id);
    if (error) { mostrarToast('Error', true); return; }
    const z = state.zonas.find(z => z.id === id);
    if (z) { z.nombre = nombre; z.cobertura_min_m = cobertura_min_m; z.cobertura_min_t = cobertura_min_t; z.cobertura_min_n = cobertura_min_n; z.notas = notas; }
  } else {
    const { data, error } = await sb.from('zonas').insert({ centro_id: state.centroId, nombre, cobertura_min_m, cobertura_min_t, cobertura_min_n, notas, color: '#dbeafe' }).select().single();
    if (error) { mostrarToast('Error', true); return; }
    state.zonas.push(data);
  }
  cerrarModal();
  if (currentView === 'cuadrante') {
    renderCuadrante();
  } else {
    pintarZonasEnModal();
  }
  mostrarToast(`Zona "${nombre}" guardada`);
}

async function eliminarZona(id) {
  if (!tieneRol('coordinador')) { mostrarToast('No tienes permiso para eliminar zonas', true); return; }
  if (!confirm('¿Eliminar esta zona?')) return;
  await sb.from('zonas').delete().eq('id', id);
  state.zonas = state.zonas.filter(z => z.id !== id);
  state.trabajadores.forEach(t => { if (t.zona_principal_id === id) t.zona_principal_id = null; });
  if (currentView === 'cuadrante') renderCuadrante();
  pintarZonasEnModal();
  mostrarToast('Zona eliminada');
}

function abrirSelectorTurno(trabajadorId, dia) {
  if (!tieneRol('coordinador')) {
    mostrarToast('Solo el Encargado o el Gestor pueden modificar el cuadrante', true);
    return;
  }
  const t = state.trabajadores.find(w => w.id === trabajadorId);
  if (!t) return;
  const valorActual = getTurno(trabajadorId, dia);
  const fechaCelda = new Date(state.anio, state.mesActual, dia + 1);
  const diff = Math.ceil((fechaCelda - new Date()) / 86400000);
  if (diff > 0 && diff <= state.parametros.preavisoDias && !confirm(`Preaviso legal (${state.parametros.preavisoDias} días). ¿Modificar igualmente?`)) return;
  const esFest = esFestivo(state.anio, state.mesActual, dia + 1);
  
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">Turno — ${t.nombre.split(' ')[0]} · día ${dia+1}${esFest ? ' FESTIVO' : ''}</div><div class="turno-grid">${CODIGOS_TURNO.map(c => `<div><button class="turno-btn tb-${c.cod === 'F1' ? 'F1' : c.cod || 'clear'}${valorActual === c.cod ? ' sel' : ''}" onclick="seleccionarTurno('${trabajadorId}',${dia},'${c.cod}')">${c.cod || '✕'}</button><div class="turno-label">${c.label}</div></div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:8px"><input id="turno-manual" class="modal-input" placeholder="O escribe: 2-9, HE2, HE3, F2-F31, LD25, LD26..." style="flex:1"><button class="btn btn-primary btn-sm" onclick="seleccionarTurnoManual('${trabajadorId}',${dia})">OK</button></div><button onclick="cerrarModal()" class="btn btn-secondary" style="margin-top:10px">Cancelar</button></div>`;
  document.body.appendChild(overlay);
}

async function seleccionarTurno(trabajadorId, dia, valor) {
  const t = state.trabajadores.find(w => w.id === trabajadorId);
  const ok = await setCelda(trabajadorId, dia, valor);
  if (!ok) return;
  cerrarModal();
  mostrarToast(`${t?.nombre.split(' ')[0] || ''}: día ${dia+1} → ${valor || 'vacío'}`);
}

function seleccionarTurnoManual(trabajadorId, dia) {
  const valor = document.getElementById('turno-manual')?.value?.trim() || '';
  seleccionarTurno(trabajadorId, dia, valor);
}

function renderPersonal() {
  if (!tieneRol('coordinador')) { showView('cuadrante'); return; }
  const content = document.getElementById('content');
  if (!content) return;
  const mes = state.mesActual, anio = state.anio;
  let html = `<input class="worker-search" id="worker-search" type="text" placeholder="Buscar por nombre..." value="${personalFiltro}" onkeyup="personalFiltroChange(this.value)">`;
  html += `<div class="filtro-tabs"><button class="filtro-tab${personalFiltroZona==='todas'?' active':''}" onclick="setFiltroZona('todas')">Todas</button>`;
  state.zonas.forEach(z => html += `<button class="filtro-tab${personalFiltroZona===z.id?' active':''}" onclick="setFiltroZona('${z.id}')">${z.nombre}</button>`);
  html += `<button class="filtro-tab${personalFiltroZona==='sin'?' active':''}" onclick="setFiltroZona('sin')">Sin zona</button></div>`;
  html += `<div class="filtro-tabs"><button class="filtro-tab${personalFiltroTurno==='todos'?' active':''}" onclick="setFiltroTurno('todos')">Todos los turnos</button>`;
  ['M','T','N','Rotativo','Sin asignar'].forEach(t => html += `<button class="filtro-tab${personalFiltroTurno===t?' active':''}" onclick="setFiltroTurno('${t}')">${t}</button>`);
  html += `</div>`;
  
  let filtrados = state.trabajadores.filter(t => {
    if (personalFiltro && !t.nombre.toLowerCase().includes(personalFiltro.toLowerCase())) return false;
    if (personalFiltroZona !== 'todas') {
      if (personalFiltroZona === 'sin') { if (t.zona_principal_id) return false; }
      else if (t.zona_principal_id !== personalFiltroZona) return false;
    }
    if (personalFiltroTurno !== 'todos' && t.turno_habitual !== personalFiltroTurno) return false;
    return true;
  });
  
  html += `<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">${filtrados.length} trabajadores</div>`;
  filtrados.forEach(t => html += cardWorkerHtml(t, mes, anio));
  
  if (tieneRol('coordinador')) {
    html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="btn btn-primary" onclick="modalNuevoTrabajador()">+ Añadir trabajador</button>
      <button class="btn btn-secondary" onclick="document.getElementById('file-import-personal').click()">+ Importar personal (JSON)</button>
    </div>`;
  }
  content.innerHTML = html;
}

function cardWorkerHtml(t, mes, anio) {
  const horas = getTotalHorasMes(t.id, mes, anio);
  const bolsa = getTotalHorasAnio(t.id) - state.parametros.jornadaAnualDiurna;
  const seg = getMaxDiasSeguidos(t.id, mes, anio);
  const vacDis = getVacacionesDisfrutadas(t.id);
  const vacTot = t.vacaciones_totales || 22;
  const vacPct = Math.min(100, Math.round(vacDis / vacTot * 100));
  
  return `<div class="worker-item" onclick="modalDetalleWorker('${t.id}')"><div class="worker-name">${t.nombre}${t.estado === 'baja' ? '<span class="badge badge-baja">BAJA</span>' : ''}${t.tipo === 'sustituto' ? '<span class="badge badge-sustituto">SUSTITUTO</span>' : ''}</div><div class="worker-stats"><span>${horas}h mes</span><span class="${bolsa >= 0 ? 'bolsa-pos' : 'bolsa-neg'}">${bolsa >= 0 ? '+' : ''}${bolsa}h bolsa</span><span>${seg} días</span><span>${vacDis}/${vacTot}</span><span>${t.antiguedad_anios || 0} años</span>${tieneRol('coordinador') && Number(t.coste_hora)>0 ? `<span>${Number(t.coste_hora).toFixed(2)} €/h</span>` : ''}</div><div class="vac-bar"><div class="vac-bar-fill" style="width:${vacPct}%"></div></div>${tieneRol('coordinador') ? `<div style="margin-top:8px"><button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); mostrarResumenTrabajador('${t.id}')">📊 Ver resumen</button></div>` : ''}</div>`;
}

async function guardarWorker(id) {
  const t = state.trabajadores.find(w => w.id === id);
  if (!t) return;
  const nombre = document.getElementById('dw-nombre')?.value?.trim() || t.nombre;
  const estado = document.getElementById('dw-estado')?.value || t.estado;
  const grupo = document.getElementById('dw-grupo')?.value || t.grupo;
  const costeHora = Math.max(0, parseFloat(document.getElementById('dw-coste')?.value) || 0);
  
  const estadoAnterior = t.estado;
  const { error } = await sb
    .from('trabajadores')
    .update({ nombre, estado, grupo, coste_hora: costeHora })
    .eq('id', id);
  if (error) { mostrarToast('Error al guardar', true); return; }

  if (estadoAnterior !== 'baja' && estado === 'baja') {
    const fechaInicioBaja = new Date().toISOString().slice(0,10);
    const { error: bajaError } = await sb.from('periodos_baja').insert({
      trabajador_id: id,
      centro_id: state.centroId,
      fecha_inicio: fechaInicioBaja
    });
    if (bajaError) console.warn('No se pudo guardar el periodo histórico de baja:', bajaError);
  } else if (estadoAnterior === 'baja' && estado !== 'baja') {
    const { data: abiertas } = await sb.from('periodos_baja')
      .select('id')
      .eq('trabajador_id', id)
      .eq('centro_id', state.centroId)
      .is('fecha_fin', null)
      .order('fecha_inicio', { ascending: false })
      .limit(1);
    if (abiertas?.[0]) {
      await sb.from('periodos_baja').update({
        fecha_fin: new Date().toISOString().slice(0,10)
      }).eq('id', abiertas[0].id);
    }
  }

  t.nombre = nombre; t.estado = estado; t.grupo = grupo; t.coste_hora = costeHora;
  cerrarModal(); renderPersonal();
  mostrarToast(`${nombre.split(' ')[0]} actualizado`);
}

async function eliminarTrabajador(id) {
  if (!tieneRol('coordinador')) {
    mostrarToast('No tienes permiso para eliminar trabajadores', true);
    return;
  }
  const t = state.trabajadores.find(w => w.id === id);
  const nombre = t?.nombre || 'este trabajador';
  if (!confirm(`¿Eliminar a ${nombre}? Se borrará también todo su historial de turnos y no se puede deshacer.`)) return;

  const { error } = await sb
    .from('trabajadores')
    .delete()
    .eq('id', id);
  if (error) {
    console.error('Error eliminando trabajador:', error);
    mostrarToast(`Error al eliminar: ${describirErrorSupabase(error)}`, true);
    return;
  }

  state.trabajadores = state.trabajadores.filter(w => w.id !== id);
  // Limpiamos también las celdas cacheadas de este trabajador en todos los meses
  // que tengamos en memoria, para que no queden turnos "fantasma" en pantalla.
  Object.values(state.turnos).forEach(porTrabajador => {
    delete porTrabajador[id];
  });

  cerrarModal();
  if (currentView === 'cuadrante') renderCuadrante();
  else renderPersonal();
  mostrarToast(`${nombre.split(' ')[0]} eliminado`);
}

function modalNuevoTrabajador() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">Nuevo trabajador</div>
    <label class="modal-label">Nombre</label><input class="modal-input" id="nt-nombre">
    <label class="modal-label">Tipo</label><select class="modal-input" id="nt-tipo">

    </select>
    <label class="modal-label">Coste laboral (€/h)</label><input class="modal-input" type="number" step="0.01" min="0" id="nt-coste" value="0">
    <label class="modal-label">Grupo</label><select class="modal-input" id="nt-grupo">
      <option value="manana">Mañana</option><option value="tarde">Tarde</option><option value="noche">Noche</option>
      <option value="peon">Peón</option><option value="sustituto">Sustituto</option>
    </select>
    <div class="modal-btns"><button class="btn-modal-ok" onclick="crearWorker()">Añadir</button><button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button></div>
  </div>`;
