function esFestivo(anio, mes, dia) {
  const fechaStr = `${anio}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
  return FESTIVOS_DETALLE.hasOwnProperty(fechaStr);
}

function getNombreFestivo(anio, mes, dia) {
  const fechaStr = `${anio}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
  return FESTIVOS_DETALLE[fechaStr] || { nombre: "Día festivo", emoji: "🌟", color: "verde" };
}

function diasEnMes(mes, anio) { return new Date(anio, mes + 1, 0).getDate(); }
function esFinDeSemana(dia, mes, anio) { const dow = new Date(anio, mes, dia).getDay(); return dow === 0 || dow === 6; }
function clavesMes(mes, anio) { return `${anio}-${mes}`; }

function horasCodigo(cod) {
  if (!cod) return 0;
  const num = parseInt(cod);
  if (!isNaN(num) && num >= 2 && num <= 9) return num;
  const entry = CODIGOS_TURNO.find(c => c.cod === cod);
  if (entry) return entry.horas;
  return 0;
}

// ==================== AUTH ====================
async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUserAuth = session.user;
    return await loadUserProfile();
  }
  return false;
}

let lastAuthError = null;

async function loadUserProfile() {
  if (!currentUserAuth) return false;
  lastAuthError = null;
  const { data, error } = await sb
    .from('perfiles')
    .select('*')
    .eq('id', currentUserAuth.id)
    .maybeSingle();
  if (error) {
    console.error('Error loading profile:', error);
    lastAuthError = 'No se pudo cargar tu perfil (' + (error.message || 'error de permisos') + '). Revisa las políticas RLS de la tabla "perfiles" en Supabase.';
    return false;
  }
  if (!data) {
    return await createFirstUserProfile();
  }
  state.userProfile = data;
  state.centroId = data.centro_id;
  if (data.rol === 'coordinador' || data.rol === 'supervisor') {
    await loadData();
    document.getElementById('header-sub').textContent = `👤 ${data.nombre_completo || 'Usuario'} · ${data.rol}`;
  } else {
    document.getElementById('header-sub').textContent = `👤 ${data.nombre_completo || 'Usuario'} · solo lectura`;
    await loadTrabajadores();
  }
  document.getElementById('banner-convenio').classList.remove('hidden');
  document.getElementById('user-btn').textContent = '👤';
  return true;
}

async function createFirstUserProfile() {
  const { data: centro, error: errCentroSel } = await sb
    .from('centros')
    .select('id')
    .limit(1)
    .maybeSingle();
  if (errCentroSel) {
    lastAuthError = 'No se pudo leer la tabla "centros" (' + errCentroSel.message + ').';
    return false;
  }

  let centroId = centro?.id;
  if (!centroId) {
    const { data: newCentro, error: errCentroIns } = await sb
      .from('centros')
      .insert({ nombre: 'Hospital Calatayud Limpieza' })
      .select('id')
      .single();
    if (errCentroIns) {
      lastAuthError = 'No se pudo crear el centro inicial (' + errCentroIns.message + '). Revisa los permisos de inserción en "centros".';
      return false;
    }
    centroId = newCentro?.id;
  }

  if (!centroId) {
    lastAuthError = 'No hay ningún centro disponible para asignar al usuario.';
    return false;
  }

  const { error } = await sb
    .from('perfiles')
    .insert({
      id: currentUserAuth.id,
      centro_id: centroId,
      nombre_completo: currentUserAuth.email?.split('@')[0] || 'Coordinador',
      rol: 'coordinador'
    });
  if (error) {
    lastAuthError = 'No se pudo crear tu perfil (' + error.message + '). Revisa los permisos de inserción en "perfiles".';
    return false;
  }
  mostrarToast('✅ Perfil de coordinador creado');
  return await loadUserProfile();
}

async function signIn(email, password) {
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { mostrarErrorLogin(error.message); return false; }
  currentUserAuth = data.user;
  const ok = await loadUserProfile();
  if (!ok) {
    // La autenticación fue correcta pero el perfil no se pudo cargar
    // (RLS, perfil inexistente sin permiso de creación, etc). No volvemos
    // a un login "en blanco": mostramos el motivo real.
    renderLogin(lastAuthError || 'Sesión iniciada, pero no se pudo cargar tu perfil de usuario.');
    return false;
  }
  render();
  mostrarToast('✅ Sesión iniciada');
  return true;
}

async function signUp(email, password, nombre) {
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { mostrarErrorLogin(error.message); return false; }
  if (!data.user) { mostrarErrorLogin('No se pudo crear el usuario.'); return false; }

  // Si Supabase tiene activada la confirmación de email, aquí NO hay sesión
  // todavía (data.session === null) aunque el usuario se haya creado.
  // Antes el código seguía como si hubiera entrado, y el usuario se
  // quedaba "colgado" sin explicación.
  if (!data.session) {
    renderLogin('✅ Cuenta creada. Revisa tu correo (' + email + ') y confirma tu email antes de iniciar sesión.');
    return true;
  }

  currentUserAuth = data.user;
  let ok = await loadUserProfile();
  if (!ok && !state.userProfile) {
    const { data: centro, error: errCentro } = await sb.from('centros').select('id').limit(1).maybeSingle();
    if (errCentro) {
      renderLogin('No se pudo asignar un centro al usuario (' + errCentro.message + ').');
      return false;
    }
    const centroId = centro?.id;
    if (!centroId) {
      renderLogin('No existe ningún centro en la base de datos al que asignar el usuario. Crea uno desde Supabase primero.');
      return false;
    }
    const { error: errPerfil } = await sb.from('perfiles').insert({
      id: data.user.id,
      centro_id: centroId,
      nombre_completo: nombre || data.user.email?.split('@')[0] || 'Usuario',
      rol: 'coordinador'
    });
    if (errPerfil) {
      renderLogin('No se pudo crear tu perfil (' + errPerfil.message + ').');
      return false;
    }
    ok = await loadUserProfile();
  }
  if (!ok) {
    renderLogin(lastAuthError || 'No se pudo completar el registro.');
    return false;
  }
  render();
  mostrarToast('✅ Usuario registrado');
  return true;
}

async function signOut() {
  await sb.auth.signOut();
  currentUserAuth = null;
  state.userProfile = null;
  state.centroId = null;
  if (realtimeChannel) {
    sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  document.getElementById('header-sub').textContent = 'Desconectado';
  renderLogin();
  mostrarToast('👋 Sesión cerrada');
}

async function loadTurnos() {
  const mes = state.mesActual;
  const anio = state.anio;
  const fechaInicio = `${anio}-${String(mes+1).padStart(2,'0')}-01`;
  const fechaFin = `${anio}-${String(mes+1).padStart(2,'0')}-${String(diasEnMes(mes, anio)).padStart(2,'0')}`;
  
  const { data, error } = await sb
    .from('turnos')
    .select('*')
    .eq('centro_id', state.centroId)
    .gte('fecha', fechaInicio)
    .lte('fecha', fechaFin);
  if (error) { console.error('Error loading turnos:', error); return; }
  
  const key = clavesMes(mes, anio);
  state.turnos[key] = {};
  (data || []).forEach(t => {
    if (!state.turnos[key][t.trabajador_id]) {
      state.turnos[key][t.trabajador_id] = {};
    }
    const dia = new Date(t.fecha).getDate();
    state.turnos[key][t.trabajador_id][dia - 1] = t.codigo;
  });

// ==================== REALTIME ====================
function setupRealtime() {
  if (realtimeChannel) {
    sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  
  if (!state.centroId) return;
  
  realtimeChannel = sb
    .channel('turnos-changes')
    .on(
      'postgres_changes',
      {
        event: '*',
        schema: 'public',
        table: 'turnos',
        filter: `centro_id=eq.${state.centroId}`
      },
      (payload) => {
        console.log('Realtime:', payload);
        if (payload.new?.editado_por === currentUserAuth?.id) return;
        if (payload.old?.editado_por === currentUserAuth?.id) return;
        handleTurnoChange(payload);
      }
    )
    .subscribe((status) => {
      console.log('Realtime status:', status);
      if (status === 'SUBSCRIBED') {
        document.getElementById('header-sub').textContent += ' · 🔴 En directo';
      }
    });
}

function handleTurnoChange(payload) {
  if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
    const t = payload.new;
    if (!t) return;
    const fecha = new Date(t.fecha);
    const mes = fecha.getMonth();
    const anio = fecha.getFullYear();
    const dia = fecha.getDate();
    const key = clavesMes(mes, anio);
    if (!state.turnos[key]) state.turnos[key] = {};
    if (!state.turnos[key][t.trabajador_id]) state.turnos[key][t.trabajador_id] = {};
    state.turnos[key][t.trabajador_id][dia - 1] = t.codigo;
    
    if (mes === state.mesActual && anio === state.anio && currentView === 'cuadrante') {
      const idx = state.trabajadores.findIndex(w => w.id === t.trabajador_id);
      if (idx >= 0) actualizarCeldaEnTabla(idx, dia - 1, t.codigo);
      mostrarToast('🔄 Cuadrante actualizado por otro usuario');
    }
  }
}

// ==================== FUNCIONES CUADRANTE ====================
function getCuadranteMes(mes, anio) {
  const key = clavesMes(mes, anio);
  if (!state.turnos[key]) {
    state.turnos[key] = {};
    state.trabajadores.forEach(t => {
      state.turnos[key][t.id] = {};
    });
  }
  return state.turnos[key];
}

function getTurno(trabajadorId, dia, mes, anio) {
  const key = clavesMes(mes || state.mesActual, anio || state.anio);
  const turnos = state.turnos[key];
  if (!turnos) return '';
  if (!turnos[trabajadorId]) return '';
  return turnos[trabajadorId][dia] || '';
}

async function setCelda(trabajadorId, dia, valor, mes, anio) {
  mes = mes ?? state.mesActual;
  anio = anio ?? state.anio;
  const fecha = `${anio}-${String(mes+1).padStart(2,'0')}-${String(dia+1).padStart(2,'0')}`;
  const key = clavesMes(mes, anio);
  const anterior = getTurno(trabajadorId, dia, mes, anio);
  
  const { data: existing } = await sb
    .from('turnos')
    .select('id')
    .eq('centro_id', state.centroId)
    .eq('trabajador_id', trabajadorId)
    .eq('fecha', fecha)
    .maybeSingle();
  
  let error;
  if (existing) {
    if (valor === '') {
      const { error: delError } = await sb
        .from('turnos')
        .delete()
        .eq('id', existing.id);
      error = delError;
    } else {
      const { error: updError } = await sb
        .from('turnos')
        .update({ codigo: valor, editado_por: currentUserAuth?.id })
        .eq('id', existing.id);
      error = updError;
    }
  } else if (valor !== '') {
    const { error: insError } = await sb
      .from('turnos')
      .insert({
        centro_id: state.centroId,
        trabajador_id: trabajadorId,
        fecha: fecha,
        codigo: valor,
        editado_por: currentUserAuth?.id
      });
    error = insError;
  }
  
  if (error) {
    console.error('Error guardando turno:', error);
    mostrarToast('❌ Error al guardar', true);
    return;
  }
  
  if (!state.turnos[key]) state.turnos[key] = {};
  if (!state.turnos[key][trabajadorId]) state.turnos[key][trabajadorId] = {};
  if (valor === '') {
    delete state.turnos[key][trabajadorId][dia];
  } else {
    state.turnos[key][trabajadorId][dia] = valor;
  }
  
  undoStack.push({ trabajadorId, dia, mes, anio, anterior, nuevo: valor });
  if (undoStack.length > 20) undoStack.shift();
  
  if (currentView === 'cuadrante') {
    const idx = state.trabajadores.findIndex(t => t.id === trabajadorId);
    if (idx >= 0) actualizarCeldaEnTabla(idx, dia, valor);
  }
  mostrarToast(`✓ Turno actualizado`);
}

function actualizarCeldaEnTabla(fila, columna, valor) {
  const celda = document.getElementById(`celda-${fila}-${columna}`);
  if (celda) {
    celda.textContent = valor;
    let colorClass = '';
    if (valor === 'L') colorClass = 'L';
    else if (valor === 'D') colorClass = 'D';
    else if (valor === 'E') colorClass = 'E';
    else if (valor === 'M') colorClass = 'M';
    else if (valor === 'T') colorClass = 'T';
    else if (valor === 'N') colorClass = 'N';
    else if (valor === 'HE') colorClass = 'HE';
    else if (valor === 'LIB') colorClass = 'LIB';
    else if (valor === 'V' || valor === 'VAC') colorClass = 'V';
    else if (valor === 'VA') colorClass = 'VA';
    else if (valor === 'PR') colorClass = 'PR';
    else if (valor === 'CF') colorClass = 'CF';
    else if (valor === 'IT') colorClass = 'IT';
    else if (valor === 'LD' || valor === 'LDA') colorClass = 'LD';
    else if (valor && valor.startsWith('F')) colorClass = 'F1';
    celda.className = `editable-cell ${colorClass}`;
    const totalCelda = document.getElementById(`total-${fila}`);
    if (totalCelda) {
      const t = state.trabajadores[fila];
      if (t) totalCelda.textContent = getTotalHorasMes(t.id, state.mesActual, state.anio);
    }
  }
}

function getTotalHorasMes(trabajadorId, mes, anio) {
  mes = mes ?? state.mesActual;
  anio = anio ?? state.anio;
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key];
  if (!turnos || !turnos[trabajadorId]) return 0;
  
  let total = 0;
  const dias = diasEnMes(mes, anio);
  const t = state.trabajadores.find(w => w.id === trabajadorId);
  for (let d = 0; d < dias; d++) {
    const valor = turnos[trabajadorId][d] || '';
    if (valor !== '') {
      total += horasCodigo(valor);
    } else {
      if (t?.grupo === 'manana' || t?.grupo === 'tarde') {
        total += 7;
      }
    }
  }
  return total;
}

function getTotalHorasAnio(trabajadorId, anio) {
  anio = anio ?? state.anio;
  let total = 0;
  for (let m = 0; m < 12; m++) total += getTotalHorasMes(trabajadorId, m, anio);
  return total;
}

function getMaxDiasSeguidos(trabajadorId, mes, anio) {
  mes = mes ?? state.mesActual;
  anio = anio ?? state.anio;
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key];
  if (!turnos || !turnos[trabajadorId]) return 0;
  
  let max = 0, actual = 0;
  const dias = diasEnMes(mes, anio);
  for (let d = 0; d < dias; d++) {
    const v = turnos[trabajadorId][d] || '';
    const trabajado = v && v !== 'L' && v !== 'D' && v !== 'V' && v !== 'VAC' && v !== 'VA' && v !== '';
    if (trabajado) { actual++; max = Math.max(max, actual); }
    else actual = 0;
  }
  return max;
}

function getVacacionesDisfrutadas(trabajadorId, anio) {
  anio = anio ?? state.anio;
  let dias = 0;
  for (let m = 0; m < 12; m++) {
    const key = clavesMes(m, anio);
    const turnos = state.turnos[key];
    if (!turnos || !turnos[trabajadorId]) continue;
    for (let d = 0; d < diasEnMes(m, anio); d++) {
      const v = turnos[trabajadorId][d] || '';
      if (v === 'V' || v === 'VAC' || v === 'VA') dias++;
    }
  }
  return dias;
}

function coberturaDelDia(dia, mes, anio) {
  const key = clavesMes(mes ?? state.mesActual, anio ?? state.anio);
  const turnos = state.turnos[key];
  if (!turnos) return { M: 0, T: 0, N: 0 };
  
  const result = { M: 0, T: 0, N: 0 };
  state.trabajadores.forEach(t => {
    if (t.estado === 'baja') return;
    const v = turnos[t.id]?.[dia] || '';
    if (t.grupo === 'manana' && v === '') result.M++;
    else if (t.grupo === 'tarde' && v === '') result.T++;
    else if (v === 'M') result.M++;
    else if (v === 'T') result.T++;
    else if (v === 'N') result.N++;
  });
  return result;
}

function validarCuadranteCompleto() {
  const incidencias = [];
  const mes = state.mesActual;
  const anio = state.anio;
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key];
  if (!turnos) return incidencias;
  
  state.trabajadores.forEach(t => {
    if (t.estado !== 'activo') return;
    const seg = getMaxDiasSeguidos(t.id, mes, anio);
    if (seg > state.parametros.maxDiasSeguidos) {
      incidencias.push(`⚠️ ${t.nombre}: ${seg} días seguidos trabajando (máx ${state.parametros.maxDiasSeguidos})`);
    }
    const bolsa = getTotalHorasAnio(t.id) - state.parametros.jornadaAnualDiurna;
    if (bolsa < -40) {
      incidencias.push(`📊 ${t.nombre}: bolsa ${bolsa}h (déficit > 40h)`);
    }
  });
  return incidencias;
}

}

function mostrarErrorLogin(msg) {
  const box = document.getElementById('login-error');
  if (box) {
    box.textContent = msg;
    box.classList.add('show');
  }
  mostrarToast('❌ ' + msg, true);
}

let loginMode = 'login';
function toggleLoginMode() {
  loginMode = loginMode === 'login' ? 'register' : 'login';
  const form = document.getElementById('login-form');
  const email = document.getElementById('login-email');
  const password = document.getElementById('login-password');
  const btn = form.querySelector('.btn-primary');
  const btn2 = form.querySelector('.btn-secondary');
  const switchLink = form.querySelector('.switch a');
  
  if (loginMode === 'register') {
    const nombreInput = document.createElement('input');
    nombreInput.id = 'login-nombre';
    nombreInput.type = 'text';
    nombreInput.placeholder = 'Nombre completo';
    nombreInput.className = 'modal-input';
    nombreInput.style.marginBottom = '12px';
    form.insertBefore(nombreInput, email);
    btn.textContent = 'Registrarse';
    btn.onclick = handleRegister;
    btn2.style.display = 'none';
    switchLink.textContent = 'Ya tengo cuenta';
    switchLink.onclick = toggleLoginMode;
  } else {
    const nombreInput = document.getElementById('login-nombre');
    if (nombreInput) nombreInput.remove();
    btn.textContent = 'Iniciar sesión';
    btn.onclick = handleLogin;
    btn2.style.display = '';
    switchLink.textContent = 'Regístrate aquí';
    switchLink.onclick = toggleLoginMode;
  }
}

async function handleLogin() {
  const email = document.getElementById('login-email')?.value.trim();
  const password = document.getElementById('login-password')?.value;
  if (!email || !password) { mostrarErrorLogin('Email y contraseña requeridos'); return; }
  const btn = document.getElementById('login-submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Entrando...'; }
  try {
    await signIn(email, password);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Iniciar sesión'; }
  }
}

async function handleRegister() {
  const email = document.getElementById('login-email')?.value.trim();
  const password = document.getElementById('login-password')?.value;
  const nombre = document.getElementById('login-nombre')?.value;
  if (!email || !password) { mostrarErrorLogin('Email y contraseña requeridos'); return; }
  if (password.length < 6) { mostrarErrorLogin('La contraseña debe tener al menos 6 caracteres'); return; }
  const btn = document.getElementById('login-register-btn') || document.querySelector('#login-form .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Registrando...'; }
  try {
    await signUp(email, password, nombre);
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

// ==================== VISTA INICIO ====================
function renderHome() {
  const mes = homeMes;
  const anio = state.anio;
  const dias = diasEnMes(mes, anio);
  const hoy = new Date();
  const diaHoy = hoy.getDate();
  const esHoyMes = hoy.getMonth() === mes && hoy.getFullYear() === anio;
  let html = `<div class="card"><div class="card-header"><div class="cal-nav"><button class="cal-nav-btn" onclick="cambiarHomeMes(-1)">◀</button><span class="cal-nav-title">${MESES_NOMBRES[mes]} ${anio}</span><button class="cal-nav-btn" onclick="cambiarHomeMes(1)">▶</button></div></div><div class="card-body"><div class="cal-grid">`;
  DIAS_SEMANA.forEach(d => html += `<div class="cal-wd">${d}</div>`);
  const primerDia = new Date(anio, mes, 1).getDay();
  for (let i = 0; i < primerDia; i++) html += `<div></div>`;
  for (let d = 1; d <= dias; d++) {
    const tareasDia = state.tareas.filter(t => !t.completada && new Date(t.fecha).getDate() === d && new Date(t.fecha).getMonth() === mes);
    let dotColor = tareasDia.some(t => t.prioridad === 'rojo') ? 'rojo' : tareasDia.some(t => t.prioridad === 'amber') ? 'amber' : null;
    const esHoyDia = esHoyMes && diaHoy === d;
    const fest = esFestivo(anio, mes, d);
    html += `<div class="cal-day${esHoyDia ? ' hoy' : ''}" onclick="mostrarEventosDia(${anio}, ${mes}, ${d})"><div class="cal-day-num">${d}${fest ? '<span class="festivo-icon">🌟</span>' : ''}</div>${dotColor ? `<div class="cal-dot ${dotColor}"></div>` : ''}</div>`;
  }
  html += `</div></div></div>`;
  
  const tareasHoy = state.tareas.filter(t => !t.completada && new Date(t.fecha).getDate() === diaHoy && new Date(t.fecha).getMonth() === hoy.getMonth());
  html += `<div class="card"><div class="card-header">⚠️ Tareas de hoy (${tareasHoy.length})</div><div class="card-body">`;
  if (!tareasHoy.length) html += `<p style="color:#94a3b8">Sin tareas pendientes hoy</p>`;
  tareasHoy.forEach(t => html += `<div class="aviso aviso-rojo"><strong>${t.nombre}</strong></div>`);
  html += `</div></div>`;
  
  const incidencias = validarCuadranteCompleto();
  if (incidencias.length > 0) {
    html += `<div class="card"><div class="card-header">⚠️ Alertas del cuadrante (${incidencias.length})</div><div class="card-body">`;
    incidencias.slice(0, 10).forEach(inc => {
      let clase = 'aviso-amber';
      if (inc.includes('⚠️')) clase = 'aviso-rojo';
      if (inc.includes('📊')) clase = 'aviso-azul';
      html += `<div class="aviso ${clase}" style="font-size:11px;padding:6px 10px;">${inc}</div>`;
    });
    if (incidencias.length > 10) html += `<div class="aviso aviso-gris">... y ${incidencias.length - 10} más</div>`;
    html += `</div></div>`;
  }
  
  const enBaja = state.trabajadores.filter(t => t.estado === 'baja').length;
  html += `<div class="card"><div class="card-header">📋 Resumen</div><div class="card-body" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px"><div style="text-align:center;padding:10px;background:#f8fafc;border-radius:10px"><div style="font-size:20px;font-weight:800">${state.trabajadores.length}</div><div style="font-size:10px">Trabajadores</div></div><div style="text-align:center;padding:10px;background:#fff5f5;border-radius:10px"><div style="font-size:20px;font-weight:800;color:#dc2626">${enBaja}</div><div style="font-size:10px">En baja</div></div><div style="text-align:center;padding:10px;background:#f0fdf4;border-radius:10px"><div style="font-size:20px;font-weight:800;color:#16a34a">${state.zonas.length}</div><div style="font-size:10px">Zonas</div></div><div style="text-align:center;padding:10px;background:#fef3c7;border-radius:10px"><div style="font-size:20px;font-weight:800;color:#d97706">${state.trabajadores.filter(t => t.sustituye_a_id).length}</div><div style="font-size:10px">Sustituciones</div></div></div></div>`;
  document.getElementById("content").innerHTML = html;

}

function cambiarHomeMes(delta) {
  let nuevoMes = homeMes + delta;
  if (nuevoMes < 0) nuevoMes = 11;
  if (nuevoMes > 11) nuevoMes = 0;
  homeMes = nuevoMes;
  renderHome();
}

function mostrarEventosDia(anio, mes, dia) {
  const eventos = [];
  state.tareas.forEach(t => {
    const fechaT = new Date(t.fecha);
    if (!t.completada && fechaT.getDate() === dia && fechaT.getMonth() === mes && fechaT.getFullYear() === anio) {
      eventos.push({ tipo: 'tarea', nombre: t.nombre, emoji: t.prioridad === 'rojo' ? '🔴' : '🟡', descripcion: t.prioridad, color: t.prioridad });
    }
  });
  if (esFestivo(anio, mes, dia)) {
    const fest = getNombreFestivo(anio, mes, dia);
    eventos.push({ tipo: 'festivo', nombre: fest.nombre, emoji: fest.emoji, descripcion: 'Día festivo', color: 'verde' });
  }
  if (eventos.length === 0) { mostrarToast('No hay eventos este día'); return; }
  const fechaStr = `${dia} de ${MESES_NOMBRES[mes]} de ${anio}`;
  let eventosHtml = `<div class="eventos-list">`;
  eventos.forEach(ev => {
    let bgColor = ev.color === 'rojo' ? 'background:#fee2e2;color:#991b1b' : ev.color === 'amber' ? 'background:#fef3c7;color:#92400e' : 'background:#dcfce7;color:#14532d';
    eventosHtml += `<div class="evento-item"><div class="evento-emoji">${ev.emoji}</div><div class="evento-info"><div class="evento-titulo">${ev.nombre}</div><div class="evento-desc">${ev.descripcion}</div></div><div class="evento-badge" style="${bgColor}">${ev.tipo}</div></div>`;
  });
  eventosHtml += `</div>`;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box centered"><div class="modal-title">📅 ${fechaStr}</div>${eventosHtml}<div class="modal-btns"><button class="btn-modal-cancel" onclick="cerrarModal()">Cerrar</button></div></div>`;
  document.body.appendChild(overlay);
}

function renderCuadrante() {
  const mes = state.mesActual;
  const anio = state.anio;
  const dias = diasEnMes(mes, anio);
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key] || {};
  
  let html = `<div class="mes-selector">`;
  MESES_NOMBRES.forEach((n, i) => { html += `<button class="mes-btn${i === mes ? ' active' : ''}" onclick="cambiarMes(${i})">${n.slice(0,3)}</button>`; });
  html += `</div>`;
  html += `<div class="cuad-toolbar"><input class="cuad-search" id="cuad-search" type="text" placeholder="🔍 Buscar trabajador..." value="${cuadFiltro}" onkeyup="filtrarCuadrante(this.value)"><button class="btn btn-secondary btn-sm" onclick="undoUltimoCambio()">↩ Deshacer</button><button class="btn btn-primary btn-sm" onclick="generarPDF()">📄 PDF</button><button class="btn btn-secondary btn-sm" onclick="mostrarParametros()">⚙️ Parámetros</button><button class="btn btn-warning btn-sm" onclick="vaciarCuadranteActual()">🗑 Vaciar mes</button><button class="btn btn-danger btn-sm" onclick="mostrarAlertasCuadrante()">⚠️ Validar</button></div>`;
  html += `<div class="aviso aviso-gris" style="margin-bottom:8px;font-size:11px">Pulsa una celda para cambiar el turno · Preaviso legal: ${state.parametros.preavisoDias} días</div>`;
  html += `<div class="wrap"><table><thead><tr><th style="border:0.5px solid #cbd5e1;padding:6px 4px;text-align:left;position:sticky;left:0;background:#f1f5f9;min-width:180px;">Trabajador</th>`;
  for (let d = 1; d <= dias; d++) {
    const fds = esFinDeSemana(d, mes, anio);
    const fest = esFestivo(anio, mes, d);
    html += `<th style="border:0.5px solid #cbd5e1;padding:6px 2px;text-align:center;${fds ? 'background:#eef2ff;' : ''}${fest ? 'background:#fff7ed;' : ''}">${d}</th>`;
  }
  html += `<th style="border:0.5px solid #cbd5e1;padding:6px 4px;text-align:center;background:#e8f4fd;position:sticky;right:0;">H</th></tr></thead><tbody>`;

  const filtrados = state.trabajadores.filter(t => t.nombre.toLowerCase().includes(cuadFiltro.toLowerCase()));
  for (let idx = 0; idx < filtrados.length; idx++) {
    const t = filtrados[idx];
    const total = getTotalHorasMes(t.id, mes, anio);
    const seg = getMaxDiasSeguidos(t.id, mes, anio);
    const bolsa = getTotalHorasAnio(t.id) - state.parametros.jornadaAnualDiurna;
    let rowStyle = '';
    if (t.estado === 'baja') rowStyle = 'opacity:0.55; background:#fff5f5;';
    if (t.tipo === 'sustituto') rowStyle = 'color:#dc2626;';
    html += `<tr style="${rowStyle}"><td style="border:0.5px solid #cbd5e1;padding:4px 6px;text-align:left;position:sticky;left:0;background:white;font-weight:600;">${t.nombre}${t.estado === 'baja' ? ' <span class="badge badge-baja">BAJA</span>' : ''}${t.tipo === 'sustituto' ? ' <span class="badge badge-sustituto">SUSTITUTO</span>' : ''}${seg > state.parametros.maxDiasSeguidos ? ' ⚠️' : ''}${bolsa < -40 ? ' 📉' : ''}</td>`;

    for (let d = 0; d < dias; d++) {
      const val = turnos[t.id]?.[d] || '';
      let cellStyle = 'border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;';
      if (val === 'L') cellStyle += ' color:#1d4ed8;font-weight:700;';
      else if (val === 'D') cellStyle += ' color:#15803d;font-weight:700;';
      else if (val === 'E') cellStyle += ' color:#9333ea;font-weight:700;background:#f3e8ff;';
      else if (val === 'M') cellStyle += ' color:#374151;font-weight:600;';
      else if (val === 'T') cellStyle += ' color:#374151;font-weight:600;';
      else if (val === 'N') cellStyle += ' color:#92400e;font-weight:700;';
      else if (val === 'HE') cellStyle += ' color:#6d28d9;font-weight:700;';
      else if (val === 'LIB') cellStyle += ' color:#0e7490;font-weight:700;';
      else if (val === 'V' || val === 'VAC') cellStyle += ' color:#065f46;font-weight:700;background:#d1fae5;';
      else if (val === 'VA') cellStyle += ' color:#065f46;font-weight:700;background:#d1fae5;';
      else if (val === 'PR') cellStyle += ' color:#7c3aed;font-weight:700;background:#ede9fe;';
      else if (val === 'CF') cellStyle += ' color:#0891b2;font-weight:700;background:#cffafe;';
      else if (val === 'IT') cellStyle += ' color:#991b1b;font-weight:700;background:#fee2e2;';
      else if (val === 'LD' || val === 'LDA') cellStyle += ' color:#b45309;font-weight:700;background:#fffbeb;';
      else if (val && val.startsWith('F')) cellStyle += ' color:#ea580c;font-weight:700;';
      
      const fds = esFinDeSemana(d + 1, mes, anio);
      const fest = esFestivo(anio, mes, d + 1);
      if (fds) cellStyle += ' background:#eef2ff;';
      if (fest && val && val !== 'L' && val !== 'D') cellStyle += ' background:#fff7ed;';
      
      html += `<td style="${cellStyle}" id="celda-${idx}-${d}" onclick="abrirSelectorTurno('${t.id}',${d})">${val}${fest && val && val !== 'L' && val !== 'D' && val !== 'V' && val !== 'VAC' && val !== 'VA' ? '🌟' : ''}</td>`;
    }
    html += `<td style="border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;font-weight:700;background:#e8f4fd;position:sticky;right:0;" id="total-${idx}">${total}</td></tr>`;
  }

  html += `<tr style="background:#f0fdf4;font-weight:700;"><td style="border:0.5px solid #cbd5e1;padding:4px 6px;text-align:left;position:sticky;left:0;background:#f0fdf4;">Cobertura M/T/N</td>`;
  for (let d = 0; d < dias; d++) {
    const cob = coberturaDelDia(d, mes, anio);
    let deficit = false;
    for (const zona of state.zonas) {
      if ((zona.cobertura_min_m > 0 && (cob.M || 0) < zona.cobertura_min_m) ||
          (zona.cobertura_min_t > 0 && (cob.T || 0) < zona.cobertura_min_t) ||
          (zona.cobertura_min_n > 0 && (cob.N || 0) < zona.cobertura_min_n)) deficit = true;
    }
    html += `<td style="${deficit ? 'border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;background:#fee2e2;color:#dc2626;' : 'border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;'}">${cob.M}/${cob.T}/${cob.N}</td>`;
  }
  html += `<td style="border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;background:#f0fdf4;"></td></tr>`;
  html += `</tbody></table></div>`;

  document.getElementById("content").innerHTML = html;
  document.getElementById("header-sub").textContent = `👤 ${state.userProfile?.nombre_completo || 'Usuario'} · ${MESES_NOMBRES[mes]} ${anio}`;
  document.getElementById('nav').style.display = '';
}

function cambiarMes(mes) {
  state.mesActual = mes;
  loadTurnos().then(() => {
    if (currentView === 'cuadrante') renderCuadrante();
    mostrarToast(`📅 ${MESES_NOMBRES[mes]} ${state.anio}`);
  });
}

function filtrarCuadrante(valor) {
  cuadFiltro = valor;
  renderCuadrante();
}

function mostrarAlertasCuadrante() {
  const incidencias = validarCuadranteCompleto();
  if (incidencias.length === 0) { alert('✅ No se encontraron incidencias en el cuadrante'); return; }
  alert('⚠️ INCIDENCIAS DETECTADAS:\n\n' + incidencias.join('\n'));
}

function vaciarCuadranteActual() {
  if (!confirm(`⚠️ ¿Estás seguro de que quieres VACIAR completamente el cuadrante de ${MESES_NOMBRES[state.mesActual]} ${state.anio}?`)) return;
  const mes = state.mesActual;
  const anio = state.anio;
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key] || {};
  
  for (const trabajadorId in turnos) {
    for (const dia in turnos[trabajadorId]) {
      setCelda(trabajadorId, parseInt(dia), '', mes, anio);
    }
  }
  mostrarToast(`🗑 Cuadrante de ${MESES_NOMBRES[mes]} vaciado`);
}

function mostrarParametros() {

function undoUltimoCambio() {
  if (!undoStack.length) { mostrarToast('No hay cambios que deshacer'); return; }
  const { trabajadorId, dia, mes, anio, anterior } = undoStack.pop();
  setCelda(trabajadorId, dia, anterior, mes, anio);
  mostrarToast('↩ Cambio deshecho');
}

// ==================== SELECTOR DE TURNO ====================
function abrirSelectorTurno(trabajadorId, dia) {
  const t = state.trabajadores.find(w => w.id === trabajadorId);
  if (!t) return;
  const valorActual = getTurno(trabajadorId, dia);
  const fechaCelda = new Date(state.anio, state.mesActual, dia + 1);
  const diff = Math.ceil((fechaCelda - new Date()) / 86400000);
  if (diff > 0 && diff <= state.parametros.preavisoDias && !confirm(`⚠️ Preaviso legal (${state.parametros.preavisoDias} días). ¿Modificar igualmente?`)) return;
  const esFest = esFestivo(state.anio, state.mesActual, dia + 1);
  
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">Turno — ${t.nombre.split(' ')[0]} · día ${dia+1}${esFest ? ' 🌟 FESTIVO' : ''}</div><div class="turno-grid">${CODIGOS_TURNO.map(c => `<div><button class="turno-btn tb-${c.cod === 'F1' ? 'F1' : c.cod || 'clear'}${valorActual === c.cod ? ' sel' : ''}" onclick="seleccionarTurno('${trabajadorId}',${dia},'${c.cod}')">${c.cod || '✕'}</button><div class="turno-label">${c.label}</div></div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:8px"><input id="turno-manual" class="modal-input" placeholder="O escribe: 2-9, F2-F31, LD25, LD26..." style="flex:1"><button class="btn btn-primary btn-sm" onclick="seleccionarTurnoManual('${trabajadorId}',${dia})">OK</button></div><button onclick="cerrarModal()" class="btn btn-secondary" style="margin-top:10px">Cancelar</button></div>`;
  document.body.appendChild(overlay);
}

function seleccionarTurno(trabajadorId, dia, valor) {
  const t = state.trabajadores.find(w => w.id === trabajadorId);
  setCelda(trabajadorId, dia, valor);
  cerrarModal();
  mostrarToast(`✓ ${t?.nombre.split(' ')[0] || ''}: día ${dia+1} → ${valor || 'vacío'}`);
}

function seleccionarTurnoManual(trabajadorId, dia) {
  const valor = document.getElementById('turno-manual')?.value?.trim() || '';
  seleccionarTurno(trabajadorId, dia, valor);
}

  const mes = state.mesActual, anio = state.anio;

  ['M','T','N','Rotativo','Sin asignar'].forEach(t => html += `<button class="filtro-tab${personalFiltroTurno===t?' active':''}" onclick="setFiltroTurno('${t}')">${t}</button>`);

  });
  
  html += `<div style="font-size:12px;color:#64748b;margin-bottom:10px">${filtrados.length} trabajadores</div>`;
  filtrados.forEach(t => html += cardWorkerHtml(t, mes, anio));
  html += `<button class="btn btn-primary" onclick="modalNuevoTrabajador()">➕ Añadir trabajador</button>`;
  document.getElementById("content").innerHTML = html;
}

function cardWorkerHtml(t, mes, anio) {
  const horas = getTotalHorasMes(t.id, mes, anio);
  const bolsa = getTotalHorasAnio(t.id) - state.parametros.jornadaAnualDiurna;
  const seg = getMaxDiasSeguidos(t.id, mes, anio);
  const vacDis = getVacacionesDisfrutadas(t.id);
  const vacTot = t.vacaciones_totales || 22;
  const vacPct = Math.min(100, Math.round(vacDis / vacTot * 100));
  
  return `<div class="worker-item" onclick="modalDetalleWorker('${t.id}')"><div class="worker-name">${t.nombre}${t.estado === 'baja' ? '<span class="badge badge-baja">BAJA</span>' : ''}${t.tipo === 'sustituto' ? '<span class="badge badge-sustituto">SUSTITUTO</span>' : ''}</div><div class="worker-stats"><span>📅 ${horas}h mes</span><span class="${bolsa >= 0 ? 'bolsa-pos' : 'bolsa-neg'}">${bolsa >= 0 ? '+' : ''}${bolsa}h bolsa</span><span>🔄 ${seg} días</span><span>🏖 ${vacDis}/${vacTot}</span><span>📅 ${t.antiguedad_anios || 0} años</span></div><div class="vac-bar"><div class="vac-bar-fill" style="width:${vacPct}%"></div></div></div>`;
}

async function crearWorker() {
  const nombre = document.getElementById('nt-nombre')?.value?.trim();
  const tipo = document.getElementById('nt-tipo')?.value || 'fijo';
  const grupo = document.getElementById('nt-grupo')?.value || 'manana';
  if (!nombre) { mostrarToast('❌ Nombre requerido', true); return; }
  const turnoBase = grupo === 'manana' ? 'M' : grupo === 'tarde' ? 'T' : grupo === 'noche' ? 'N' : 'M';
  const { data, error } = await sb
    .from('trabajadores')
    .insert({
      centro_id: state.centroId,
      nombre,
      tipo,
      grupo,
      turno_base: turnoBase,
      turno_habitual: turnoBase,
      estado: tipo === 'sustituto' ? 'inactivo' : 'activo'
    })
    .select()
    .single();
  if (error) { mostrarToast('❌ Error al crear', true); return; }
  state.trabajadores.push(data);
  guardarDatos(); cerrarModal(); renderPersonal();
  mostrarToast(`✅ ${nombre.split(' ')[0]} añadido`);
}

async function iniciarBajaWorker(id) {
  const t = state.trabajadores.find(w => w.id === id);
  if (!t) return;
  const diaInicio = prompt(`Día de inicio de la baja (1-${diasEnMes(state.mesActual, state.anio)}):`);
  if (!diaInicio) return;
  const dia = parseInt(diaInicio) - 1;
  if (isNaN(dia) || dia < 0) { mostrarToast('❌ Día inválido', true); return; }
  
  await sb.from('trabajadores').update({ estado: 'baja', fecha_baja: `${state.anio}-${String(state.mesActual+1).padStart(2,'0')}-${String(dia+1).padStart(2,'0')}` }).eq('id', id);
  t.estado = 'baja';
  const dias = diasEnMes(state.mesActual, state.anio);
  for (let d = dia; d < dias; d++) {
    await setCelda(id, d, 'IT', state.mesActual, state.anio);
  }
  guardarDatos(); cerrarModal(); renderPersonal();
  if (currentView === 'cuadrante') renderCuadrante();
  mostrarToast('✅ Baja registrada');
}

async function guardarZona(id) {
  const nombre = document.getElementById('z-nombre')?.value?.trim();
  if (!nombre) { mostrarToast('❌ Nombre requerido', true); return; }
  const cobertura_min_m = parseInt(document.getElementById('z-cob-M')?.value) || 0;
  const cobertura_min_t = parseInt(document.getElementById('z-cob-T')?.value) || 0;
  const cobertura_min_n = parseInt(document.getElementById('z-cob-N')?.value) || 0;
  const notas = document.getElementById('z-notas')?.value || '';
  
  if (id) {
    const { error } = await sb.from('zonas').update({ nombre, cobertura_min_m, cobertura_min_t, cobertura_min_n, notas }).eq('id', id);
    if (error) { mostrarToast('❌ Error', true); return; }
    const z = state.zonas.find(z => z.id === id);
    if (z) { z.nombre = nombre; z.cobertura_min_m = cobertura_min_m; z.cobertura_min_t = cobertura_min_t; z.cobertura_min_n = cobertura_min_n; z.notas = notas; }
  } else {
    const { data, error } = await sb.from('zonas').insert({ centro_id: state.centroId, nombre, cobertura_min_m, cobertura_min_t, cobertura_min_n, notas, color: '#dbeafe' }).select().single();
    if (error) { mostrarToast('❌ Error', true); return; }
    state.zonas.push(data);
  }
  guardarDatos(); cerrarModal(); renderZonas();
  mostrarToast(`✅ Zona "${nombre}" guardada`);
}

// ==================== GENERAR PDF ====================
function generarPDF() {
  const mes = state.mesActual;
  const anio = state.anio;
  const nombreMes = MESES_NOMBRES[mes];
  const dias = diasEnMes(mes, anio);
  const key = clavesMes(mes, anio);
  const turnos = state.turnos[key] || {};
  
  let tablaHtml = `<table style="width:100%;border-collapse:collapse;font-size:7px;"><thead><tr><th style="border:0.5px solid #000;padding:4px;text-align:left;">Trabajador</th>`;
  for (let d = 1; d <= dias; d++) {
    const dow = new Date(anio, mes, d).getDay();
    const dowName = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][dow];
    tablaHtml += `<th style="border:0.5px solid #000;padding:4px;text-align:center;">${d}<br><span style="font-size:6px;font-weight:normal">${dowName}</span></th>`;
  }
  tablaHtml += `<th style="border:0.5px solid #000;padding:4px;text-align:center;">H</th></tr></thead><tbody>`;
  
  state.trabajadores.forEach(t => {
    if (t.estado === 'baja') return;
    const total = getTotalHorasMes(t.id, mes, anio);
    tablaHtml += `<tr><td style="border:0.5px solid #000;padding:4px;text-align:left;">${t.nombre}</td>`;
    for (let d = 0; d < dias; d++) {
      const val = turnos[t.id]?.[d] || '';
      let estilo = 'border:0.5px solid #000;padding:4px;text-align:center;';
      if (val === 'L') estilo += 'color:#1d4ed8;font-weight:700;';
      else if (val === 'D') estilo += 'color:#15803d;font-weight:700;';
      else if (val === 'E') estilo += 'color:#9333ea;font-weight:700;background:#f3e8ff;';
      else if (val === 'M' || val === 'T') estilo += 'color:#374151;font-weight:600;';
      else if (val === 'N') estilo += 'color:#92400e;font-weight:700;';
      else if (val === 'V' || val === 'VAC' || val === 'VA') estilo += 'color:#065f46;font-weight:700;background:#d1fae5;';
      else if (val === 'PR') estilo += 'color:#7c3aed;font-weight:700;background:#ede9fe;';
      else if (val === 'CF') estilo += 'color:#0891b2;font-weight:700;background:#cffafe;';
      else if (val === 'IT') estilo += 'color:#991b1b;font-weight:700;background:#fee2e2;';
      else if (val === 'LD' || val === 'LDA') estilo += 'color:#b45309;font-weight:700;background:#fffbeb;';
      else if (val && val.startsWith('F')) estilo += 'color:#ea580c;font-weight:700;';
      tablaHtml += `<td style="${estilo}">${val}</td>`;
    }
    tablaHtml += `<td style="border:0.5px solid #000;padding:4px;text-align:center;font-weight:700;background:#e8f4fd;">${total}</td></tr>`;
  });
  tablaHtml += `</tbody></table>`;
  
  const contenidoHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Cuadrante ${nombreMes} ${anio}</title><style>@page{size:A4 landscape;margin:8mm;}body{font-family:Arial;margin:0;padding:10px;}h2{color:#0f172a;}p{color:#64748b;font-size:8px;}table{width:100%;border-collapse:collapse;font-size:7px;}th,td{border:0.5px solid #999;padding:3px 2px;text-align:center;}th{background:#f1f5f9;}</style></head><body><h2>🧹 Cuadrante de trabajo</h2><p><strong>Centro:</strong> Hospital Calatayud Limpieza · <strong>Mes:</strong> ${nombreMes} ${anio} · <strong>Generado:</strong> ${new Date().toLocaleString('es-ES')}</p>${tablaHtml}<p style="margin-top:12px;font-size:6px;color:#999;">Documento generado automáticamente por Gestión Cuadrantes v${APP_VERSION}</p></body></html>`;
  const ventana = window.open();
  ventana.document.write(contenidoHtml);
  ventana.document.close();
  ventana.focus();
  setTimeout(() => ventana.print(), 500);
}

// ==================== UTILIDADES ====================
function mostrarToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#dc2626' : '#0f172a';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function cerrarModal() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
}

function toggleUserMenu() {
  if (confirm('¿Cerrar sesión?')) signOut();
}

function showView(view) {
  if (!state.userProfile) return;
  currentView = view;
  document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(`nav-${view}`)?.classList.add('active');
  if (view === 'home') renderHome();
  else if (view === 'cuadrante') renderCuadrante();
  else if (view === 'personal') renderPersonal();
  else if (view === 'zonas') renderZonas();
  else if (view === 'tareas') renderTareas();
  else if (view === 'seguro') renderSeguro();
}

function render() {
  if (state.userProfile) {
    document.getElementById('nav').style.display = '';
    showView(currentView);
  } else {
    renderLogin();
  }
}

// ==================== INICIALIZACIÓN ====================
document.addEventListener('DOMContentLoaded', async () => {
  const authed = await checkAuth();
  if (authed && state.userProfile) {
    document.getElementById('nav').style.display = '';
    render();
  } else if (currentUserAuth) {
    // Hay una sesión válida de Supabase pero el perfil no se pudo cargar:
    // no lo ocultamos, mostramos el motivo para poder depurarlo.
    renderLogin(lastAuthError || 'Hay una sesión activa pero no se pudo cargar tu perfil. Contacta con el administrador.');
  } else {
    renderLogin();
  }
});

document.getElementById('file-import')?.addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      for (const t of data.trabajadores || []) {
        await sb.from('trabajadores').upsert({ ...t, centro_id: state.centroId });
      }
      for (const key in data.turnos || {}) {
        const [anio, mes] = key.split('-').map(Number);
        for (const trabajadorId in data.turnos[key]) {
          for (const dia in data.turnos[key][trabajadorId]) {
            const val = data.turnos[key][trabajadorId][dia];
            if (val) {
              await setCelda(trabajadorId, parseInt(dia), val, mes, anio);
            }
          }
        }
      }
      await loadData();
      render();
      mostrarToast('✅ Backup importado');
    } catch (err) {
      mostrarToast('❌ Archivo inválido', true);
    }
  };
  r.readAsText(file);
  event.target.value = '';
});
</script>
